<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints>0);

const DEF={
  sens:1.5, fov:78, bright:1.5, dist:isMobile?30:55,
  hud:1.0, qual:0,
  fps:0,
  lod:isMobile?15:30,
  npcCount:isMobile?8:15,
  showFps:1
};
let cfg=Object.assign({},DEF);
try{Object.assign(cfg,JSON.parse(localStorage.getItem('sh43v4')||'{}'));}catch(e){}

const PR_OPTS=[0.5, 0.75, 1.0, 1.5];
const FPS_OPTS=[0, 60, 30, 45, 120];

let device = isMobile ? 'touch' : 'kbm';
let difficulty = 'normal';
const DIFF={
  easy:  {anomMul:0.55, hungRate:0.30, stamRate:8,  sanityRate:0,  label:'ЛЕГКО'},
  normal:{anomMul:1.00, hungRate:0.55, stamRate:11, sanityRate:0,  label:'НОРМА'},
  hard:  {anomMul:1.65, hungRate:0.85, stamRate:15, sanityRate:0,  label:'СЛОЖНО'},
  horror:{anomMul:2.20, hungRate:1.00, stamRate:18, sanityRate:0.8,label:'ХОРРОР'}
};
const isHorror=()=>difficulty==='horror';

const DAY_SECONDS = 300;
const MAX_DAY = 5;

const G={
  running:false, paused:false, dead:false,
  day:1, dayTime:0, seed:1,
  stam:100, hunger:100, sanity:100, floor:0,
  bell:false, bellT:0,
  code1:false, code1T:0,
  deaths:0, ach:new Set(), smoke:[],
  tpCD:0, hasKnife:false, hasBun:false,
  vapeCD:0,
  fiz:{active:false, t:0, jumps:0, done:false},
  larionovActive:false, larionovT:0,
  amiraSpawned:false, escapeReady:false,
  rulesShown:false,
  flashlightOn:true,
  radioOpen:false,
  screamerCD:0,
  fps:60, fpsAcc:0, fpsFrames:0
};

let renderer=null, scene=null, camera=null, torch=null, world=null, canvas=null;
const BOX_GEO = new THREE.BoxGeometry(1, 1, 1);

function initThree(){
  renderer=new THREE.WebGLRenderer({
    antialias:false, powerPreference:'high-performance',
    stencil:false, depth:true, alpha:false
  });
  const pr = isMobile ? 0.75 : PR_OPTS[cfg.qual];
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.sortObjects = false;
  document.body.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a2230);
  scene.fog=new THREE.Fog(0x1a2230,5,cfg.dist);

  camera=new THREE.PerspectiveCamera(cfg.fov,innerWidth/innerHeight,0.15,isMobile?80:150);
  camera.rotation.order='YXZ';
  scene.add(camera);

  const amb=new THREE.AmbientLight(0xffffff, isHorror()?0.4:0.85);
  scene.add(amb);
  const hemi=new THREE.HemisphereLight(0xd0e0f0,0x505860, isHorror()?0.35:0.55);
  scene.add(hemi);

  torch=new THREE.PointLight(0xfff4dc, isHorror()?2.5:1.8, isHorror()?14:20, 1.5);
  torch.position.set(0,0,0);
  camera.add(torch);

  world=new THREE.Group();
  world.matrixAutoUpdate = false;
  scene.add(world);

  attachCanvas();
  if(cfg.showFps) document.getElementById('fps').style.display='block';
  else document.getElementById('fps').style.display='none';
}
function attachCanvas(){
  if(!renderer || !renderer.domElement) return;
  canvas=renderer.domElement;
  canvas.addEventListener('click',()=>{
    if(G.running && !G.paused && !mouseLocked) requestLock();
  });
}
function requestLock(){
  if(!canvas || device==='touch') return;
  if(G.running && !G.paused && !G.dead){
    const p=canvas.requestPointerLock();
    if(p&&p.catch) p.catch(()=>{});
  }
}

let M={};
function initMaterials(){
  M.floor = new THREE.MeshLambertMaterial({color:0xb8c0b0});
  M.ceil = new THREE.MeshLambertMaterial({color:0xd8d8cc});
  M.wall = new THREE.MeshLambertMaterial({color:0xc0c8b8});
  M.wall2 = new THREE.MeshLambertMaterial({color:0xa8b4c0});
  M.wood = new THREE.MeshLambertMaterial({color:0xa07850});
  M.desk = new THREE.MeshLambertMaterial({color:0xc8b080});
  M.metal = new THREE.MeshLambertMaterial({color:0x808890});
  M.dark = new THREE.MeshLambertMaterial({color:0x404850});
  M.lamp = new THREE.MeshBasicMaterial({color:0xfff8e0});
  M.red = new THREE.MeshLambertMaterial({color:0xa04040});
  M.white = new THREE.MeshLambertMaterial({color:0xe8e8e8});
  M.black = new THREE.MeshLambertMaterial({color:0x1a1a20});
  M.board = new THREE.MeshLambertMaterial({color:0x1a3a25});
  M.chair = new THREE.MeshLambertMaterial({color:0x6a4a2a});
}

const FH=4.0, WH=3.5;
const X_MIN=-50, X_MAX=50, Z_CORR=3, Z_ROOM=20, RW=12.5;

let colliders=[], rooms={}, npcs=[], pcPos=new THREE.Vector3();
let layout=null;

const ROOM_NAMES={
  stairs:'ЛЕСТНИЦА', post:'ПОСТ', director:'ДИРЕКТОР', doctor:'МЕДКАБ',
  english:'АНГЛИЙСКИЙ', cafe:'СТОЛОВАЯ', gym:'СПОРТЗАЛ', gym2:'РАЗДЕВАЛКА',
  wc1:'ТУАЛЕТ', wc2:'ТУАЛЕТ', wc3:'ТУАЛЕТ', wc4:'ТУАЛЕТ',
  class1a:'1-А', class1b:'1-Б', class4b:'4-Б',
  class5a:'5-А', class6a:'6-А', class7a:'7-А',
  teachers:'УЧИТЕЛЬСКАЯ', trud:'ТРУД', storage:'СКЛАД',
  library:'БИБЛИОТЕКА', chemistry:'ХИМИЯ', math:'МАТЕМАТИКА',
  physics:'ФИЗИКА', biology:'БИОЛОГИЯ', computer:'ИНФОРМАТИКА',
  music:'МУЗЫКА', history:'ИСТОРИЯ'
};

const FIXED_F1_N=['stairs','class1a','class1b','wc1','wc2','gym','gym2','stairs'];
const FIXED_F1_S=['post','director','doctor','english','cafe','cafe','teachers','trud'];
const FIXED_F2_N=['stairs','class5a','class6a','wc3','wc4','class7a','physics','stairs'];
const POOL_S=['library','chemistry','math','biology','computer','music','history','storage'];

function rng(seed){let a=seed|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function generateLayout(seed){
  const r=rng(seed*7919+13);
  const poolS=shuffle(POOL_S,r);
  return {
    0:{ n:FIXED_F1_N.slice(), s:FIXED_F1_S.slice() },
    1:{
      n:FIXED_F2_N.slice(),
      s:[poolS[0]||'library',poolS[1]||'chemistry',poolS[2]||'math',poolS[3]||'biology',
         poolS[4]||'computer',poolS[5]||'music',poolS[6]||'history',poolS[7]||'storage']
    }
  };
}
function roomBounds(i,side){
  const x0=X_MIN+RW*i, x1=x0+RW;
  if(side==='n') return {x0,x1,z0:Z_CORR,z1:Z_ROOM};
  return {x0,x1,z0:-Z_ROOM,z1:-Z_CORR};
}
function addBox(x,y,z,w,h,d,mat,col){
  if(col===undefined) col=true;
  const o=new THREE.Mesh(BOX_GEO, mat);
  o.position.set(x,y,z);
  o.scale.set(w,h,d);
  o.matrixAutoUpdate = false;
  o.updateMatrix();
  world.add(o);
  if(col) colliders.push({
    minX:x-w/2, maxX:x+w/2,
    minY:y-h/2, maxY:y+h/2,
    minZ:z-d/2, maxZ:z+d/2
  });
  return o;
}
function wallAlongX(x0,x1,z,y0,gaps,mat){
  const ops=(gaps||[]).slice().sort((a,b)=>a[0]-b[0]);
  let cur=x0;
  for(const [a,b] of ops){
    if(a>cur) addBox((cur+a)/2,y0+WH/2,z,a-cur,WH,0.35,mat);
    cur=Math.max(cur,b);
  }
  if(cur<x1) addBox((cur+x1)/2,y0+WH/2,z,x1-cur,WH,0.35,mat);
}

const signTexCache = {};
function makeSignTexture(text){
  if(signTexCache[text]) return signTexCache[text];
  const c=document.createElement('canvas');
  c.width=256; c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='#0e3260'; g.fillRect(0,0,256,64);
  g.strokeStyle='#f0f8ff'; g.lineWidth=4;
  g.strokeRect(2,2,252,60);
  g.fillStyle='#ffffff';
  g.font='bold 26px Consolas, monospace';
  g.textAlign='center';
  g.textBaseline='middle';
  g.fillText(text, 128, 34);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=THREE.LinearFilter;
  t.minFilter=THREE.LinearFilter;
  t.generateMipmaps=false;
  signTexCache[text]=t;
  return t;
}
function addDoorSign(cx, y, z, text, facing){
  const tex = makeSignTexture(text);
  const mat = new THREE.MeshBasicMaterial({ map: tex, fog:false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.55), mat);
  mesh.position.set(cx, y, z);
  mesh.rotation.y = facing==='n' ? Math.PI : 0;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  world.add(mesh);
}

function buildSchool(){
  if(!world) return;
  while(world.children.length) world.remove(world.children[0]);
  colliders=[]; rooms={}; npcs=[];
  G.smoke=[];
  for(const k in signTexCache) delete signTexCache[k];

  layout=generateLayout(G.seed);

  addBox(0,-0.15,0,X_MAX-X_MIN+2,0.3,Z_ROOM*2+2,M.floor,false);
  addBox(0,FH-0.15,0,X_MAX-X_MIN+2,0.3,Z_ROOM*2+2,M.ceil,false);
  addBox(0,2*FH-0.15,0,X_MAX-X_MIN+2,0.3,Z_ROOM*2+2,M.ceil,false);

  for(let f=0;f<2;f++){
    const y0=f*FH;
    const L=layout[f];

    addBox(0,y0+WH/2, Z_ROOM+0.2, X_MAX-X_MIN+2, WH, 0.4, M.wall);
    addBox(0,y0+WH/2,-Z_ROOM-0.2, X_MAX-X_MIN+2, WH, 0.4, M.wall);
    addBox(X_MIN-0.2,y0+WH/2,0, 0.4, WH, Z_ROOM*2+2, M.wall);
    addBox(X_MAX+0.2,y0+WH/2,0, 0.4, WH, Z_ROOM*2+2, M.wall);

    const gN=[],gS=[];
    for(let i=0;i<8;i++){
      const bn=roomBounds(i,'n'),bs=roomBounds(i,'s');
      gN.push([(bn.x0+bn.x1)/2-1.3,(bn.x0+bn.x1)/2+1.3]);
      gS.push([(bs.x0+bs.x1)/2-1.3,(bs.x0+bs.x1)/2+1.3]);
    }
    wallAlongX(X_MIN,X_MAX,Z_CORR,y0,gN,M.wall2);
    wallAlongX(X_MIN,X_MAX,-Z_CORR,y0,gS,M.wall2);

    for(let i=1;i<8;i++){
      const x=X_MIN+RW*i;
      const rn1=L.n[i-1],rn2=L.n[i];
      const rs1=L.s[i-1],rs2=L.s[i];
      const skipN=(rn1==='gym'&&rn2==='gym2')||(rn1==='cafe'&&rn2==='cafe');
      const skipS=(rs1==='cafe'&&rs2==='cafe');
      if(!skipN) addBox(x,y0+WH/2,(Z_CORR+Z_ROOM)/2,0.3,WH,Z_ROOM-Z_CORR,M.wall);
      if(!skipS) addBox(x,y0+WH/2,-(Z_CORR+Z_ROOM)/2,0.3,WH,Z_ROOM-Z_CORR,M.wall);
    }

    for(let i=0;i<8;i++){
      const bn=roomBounds(i,'n'),bs=roomBounds(i,'s');
      const rn=L.n[i], rs=L.s[i];
      const cxn=(bn.x0+bn.x1)/2, cxs=(bs.x0+bs.x1)/2;

      rooms[`${f}_n_${i}`]={type:rn,...bn,cx:cxn,cz:(bn.z0+bn.z1)/2};
      rooms[`${f}_s_${i}`]={type:rs,...bs,cx:cxs,cz:(bs.z0+bs.z1)/2};

      addDoorSign(cxn+1.9, y0+WH-0.5, Z_CORR-0.2, ROOM_NAMES[rn]||'?', 'n');
      addDoorSign(cxs-1.9, y0+WH-0.5, -Z_CORR+0.2, ROOM_NAMES[rs]||'?', 's');

      fillRoom(rn, rooms[`${f}_n_${i}`], y0, f, i, 'n');
      fillRoom(rs, rooms[`${f}_s_${i}`], y0, f, i, 's');
    }

    const lampStep = isMobile ? 25 : 15;
    for(let x=X_MIN+8;x<=X_MAX-8;x+=lampStep){
      addBox(x,y0+WH-0.1,0,2.4,0.08,0.5,M.lamp,false);
    }
  }

  const EL=isMobile?100:200, HW=2.5;
  addBox(X_MIN-EL/2,-0.15,0,EL,0.3,HW*2+0.5,M.floor,false);
  addBox(X_MIN-EL/2,WH,0,EL,0.3,HW*2+0.5,M.ceil,false);
  addBox(X_MIN-EL/2,WH/2,-HW-0.25,EL,WH,0.3,M.wall2,false);
  addBox(X_MIN-EL/2,WH/2,HW+0.25,EL,WH,0.3,M.wall2,false);
  colliders.push({minX:-9999,maxX:X_MIN,minY:0,maxY:WH,minZ:-HW-0.5,maxZ:-HW});
  colliders.push({minX:-9999,maxX:X_MIN,minY:0,maxY:WH,minZ:HW,maxZ:HW+0.5});

  const post=rooms['0_s_0'];
  if(post) pcPos.set(post.cx-1.6,1.2,post.cz+3);
}

function fillRoom(type,b,y0,f,i,side){
  const isClass=type.startsWith('class');

  if(isClass){
    for(let r=0;r<2;r++) for(let c=0;c<2;c++){
      const x=b.x0+3.5+c*5;
      const z=b.cz-2+r*4;
      addBox(x,y0+0.75,z,1.4,0.08,0.7,M.desk,false);
      addBox(x,y0+0.4,z,1.4,0.75,0.1,M.wood,false);
      colliders.push({minX:x-0.7,maxX:x+0.7,minY:y0,maxY:y0+0.85,minZ:z-0.4,maxZ:z+0.4});
    }
    const bz=side==='n'?b.z1-0.2:b.z0+0.2;
    const bd=new THREE.Mesh(new THREE.PlaneGeometry(4,1.4),M.board);
    bd.position.set(b.cx,y0+2.0,bz);
    bd.rotation.y=side==='n'?Math.PI:0;
    bd.matrixAutoUpdate=false;bd.updateMatrix();
    world.add(bd);
  }
  else if(type==='cafe'&&i===4){
    for(let c=0;c<3;c++){
      const x=b.x0+3+c*3.5;
      addBox(x,y0+0.75,b.cz,1.4,0.08,0.8,M.desk,false);
    }
  }
  else if(type==='gym'&&i===5){
    for(let k=0;k<2;k++) addBox(b.x0+2+k*3,y0+0.35,b.z1-1.5,2.2,0.15,0.4,M.wood);
  }
  else if(type==='gym2'){
    addBox(b.cx,y0+0.3,b.cz-3,2,0.15,0.4,M.wood);
    addBox(b.cx,y0+0.5,b.cz-3,2,0.15,0.4,M.wood);
  }
  else if(type.startsWith('wc')){
    for(let k=0;k<2;k++) addBox(b.x0+3+k*4,y0+0.5,b.z1-1.5,1.2,2,0.15,M.metal,false);
    addBox(b.cx,y0+0.85,b.z0+1.5,3,0.2,0.6,M.white);
  }
  else if(type==='post'&&f===0&&i===0){
    addBox(b.cx-1.6,y0+0.45,b.cz+3,1.8,0.9,0.9,M.wood);
    addBox(b.cx-1.6,y0+1.2,b.cz+3,1.0,0.65,0.1,M.dark,false);
    addBox(b.cx+3,y0+0.4,b.cz-4.5,2,0.5,1.1,M.dark);
  }
  else if(type==='director'&&f===0){
    // Стол директора
    addBox(b.cx,y0+0.45,b.cz+3.5,2.4,0.85,1.2,M.wood);
    // Стул директора (за столом)
    addBox(b.cx,y0+0.45,b.cz+5,0.6,0.9,0.6,M.black,false);
    // Шкаф с документами
    addBox(b.x0+1.5,y0+1.0,b.cz-3,0.8,2.0,1.2,M.wood);
    // Сейф
    addBox(b.x1-1.5,y0+0.9,b.cz-3,1.0,1.7,0.9,M.metal);
    // 3 стула для прогульщиков (перед столом)
    for(let k=0;k<3;k++){
      const cx=b.cx-2.5+k*2.5;
      const cz=b.cz+1.8;
      addBox(cx,y0+0.35,cz,0.6,0.7,0.6,M.chair,false);   // стул
      addBox(cx,y0+0.7,cz,0.6,0.1,0.6,M.chair,false);    // сиденье
      colliders.push({minX:cx-0.35,maxX:cx+0.35,minY:y0,maxY:y0+0.8,minZ:cz-0.35,maxZ:cz+0.35});
    }
  }
  else if(type==='doctor'&&f===0){
    addBox(b.cx-1.5,y0+0.4,b.cz+3,2,0.5,1.1,M.white);
  }
  else if(type==='english'){
    for(let r=0;r<2;r++) for(let c=0;c<2;c++)
      addBox(b.x0+3+c*5,y0+0.75,b.cz-2+r*4,1.4,0.08,0.7,M.desk,false);
  }
  else if(type==='trud'&&f===0){
    for(let k=0;k<2;k++) addBox(b.x0+3+k*5,y0+0.45,b.cz+2,2,0.9,1,M.wood);
  }
  else if(type==='storage'){
    for(let k=0;k<3;k++) addBox(b.x0+2+k*2.5,y0+0.95,b.cz+3,0.8,1.9,0.6,M.metal);
  }
  else if(type==='library'){
    for(let k=0;k<2;k++) addBox(b.x0+3+k*5,y0+1.2,b.cz+3,2.2,2.4,0.4,M.wood);
  }
  else if(type==='chemistry'||type==='physics'){
    for(let k=0;k<2;k++) for(let j=0;j<2;j++)
      addBox(b.x0+3+k*5,y0+0.75,b.cz-3+j*6,1.6,0.08,1,M.desk,false);
  }
  else if(type==='computer'){
    for(let k=0;k<2;k++) for(let j=0;j<2;j++){
      const x=b.x0+3+k*5,z=b.cz-2+j*4;
      addBox(x,y0+0.75,z,1.4,0.08,0.75,M.desk,false);
    }
  }
  else if(type==='music'){
    addBox(b.cx,y0+0.5,b.cz+4,2,1,0.7,M.black);
  }
}

const P={x:0,z:0,yaw:0,pitch:0,radius:0.38,floor:0};

function makeHuman(shirt,pants,skin,scale){
  scale=scale||1;
  const g=new THREE.Group();
  const mk=(w,h,d,c,y)=>{const o=new THREE.Mesh(BOX_GEO,new THREE.MeshLambertMaterial({color:c}));o.scale.set(w*scale,h*scale,d*scale);o.position.y=y*scale;o.matrixAutoUpdate=false;o.updateMatrix();g.add(o);return o;};
  mk(0.5,0.72,0.3,shirt,1.16);
  mk(0.26,0.28,0.26,skin||0xe0b890,1.64);
  const a1=mk(0.14,0.55,0.14,shirt,1.16);a1.position.x=-0.33*scale;
  const a2=mk(0.14,0.55,0.14,shirt,1.16);a2.position.x=0.33*scale;
  const l1=mk(0.17,0.72,0.18,pants,0.36);l1.position.x=-0.12*scale;
  const l2=mk(0.17,0.72,0.18,pants,0.36);l2.position.x=0.12*scale;
  g.userData.limbs=[a1,a2,l1,l2];
  return g;
}
function nameSprite(text,color){
  const c=document.createElement('canvas');
  c.width=128;c.height=32;
  const g=c.getContext('2d');
  g.font='bold 16px Consolas';
  g.textAlign='center';
  g.lineWidth=2;g.strokeStyle='#000';
  g.strokeText(text,64,22);
  g.fillStyle=color||'#ffe9a0';g.fillText(text,64,22);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:t,depthTest:false,transparent:true
  }));
  sp.scale.set(1.3,0.32,1);
  return sp;
}
function spawnNPC(id,x,y,z,name,kind,color,opts){
  opts=opts||{};
  const g=makeHuman(opts.shirt||color||0x6677aa,opts.pants||0x333a44,opts.skin,opts.scale);
  g.position.set(x,y,z);
  world.add(g);
  const sp=nameSprite(name,kind==='anomaly'?'#ff9a9a':(kind==='staff'?'#9ad0ff':(kind==='friendly'?'#a0ffa0':(kind==='truant'?'#ffb060':'#ffe9a0'))));
  sp.position.y=2.1*(opts.scale||1);
  g.add(sp);
  const npc={
    id,name,kind,obj:g,
    state:opts.state||'idle',
    speed:opts.speed||0.9,
    hostile:!!opts.hostile,
    tx:x,tz:z,wanderT:Math.random()*3,
    dialogue:opts.dialogue||null,
    onContact:opts.onContact||null,
    bob:Math.random()*6,
    y:y,
    noMove:opts.noMove||false,
    pose:opts.pose||null,
    visible:true
  };
  if(opts.pose){
    const L=g.userData.limbs;
    if(opts.pose==='smoking'){L[0].rotation.x=-1.2;L[1].rotation.x=-1.0;}
    if(opts.pose==='smearing'){L[0].rotation.x=-1.4;}
    if(opts.pose==='oiled'){L[0].rotation.z=0.7;L[1].rotation.z=-0.7;}
    if(opts.pose==='sit'){
      // Ноги вперёд, руки на коленях
      L[2].rotation.x=-1.5;L[3].rotation.x=-1.5;
      L[0].rotation.x=0.3;L[1].rotation.x=0.3;
      // Смещение вниз — сидит
      g.position.y -= 0.45;
    }
    if(opts.pose==='sad'){
      // Опущенные руки, голова вниз — для прогульщиков
      L[0].rotation.z=0.2;L[1].rotation.z=-0.2;
    }
    L.forEach(l=>{l.updateMatrix();});
  }
  npcs.push(npc);
  return npc;
}
const findNPC=id=>npcs.find(n=>n.id===id);
const removeNPC=n=>{if(!n)return;world.remove(n.obj);const i=npcs.indexOf(n);if(i>=0)npcs.splice(i,1);};

function gameHour(){
  const t=G.dayTime/DAY_SECONDS;
  return (20+t*11.5)%24;
}
function timeStr(){
  const h=gameHour();
  return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h-Math.floor(h))*60)).padStart(2,'0');
}
function isNight(){const h=gameHour();return h>=20||h<7.5;}
function skyHex(){
  const h=gameHour();
  const horror=isHorror();
  if(h>=21||h<4.5) return horror?0x020204:0x141c2c;
  if(h<6) return horror?0x08080e:0x243048;
  if(h<7.5) return horror?0x1a1820:0x4a4055;
  if(h<9) return 0x8098b8;
  if(h<16) return 0x88b0d0;
  if(h<18.5) return 0xb0906a;
  if(h<20) return horror?0x100810:0x302840;
  return horror?0x020204:0x141c2c;
}
function updateSky(){
  if(!scene) return;
  const c=skyHex();
  scene.background.setHex(c);
  scene.fog.color.setHex(c);
}

function triggerScreamer(){
  if(!isHorror()||G.screamerCD>0) return;
  G.screamerCD=8+Math.random()*12;
  const el=document.getElementById('screamer');
  const face=document.getElementById('screamerFace');
  const faces=['☠','👁','💀','👹','👻'];
  face.textContent=faces[Math.floor(Math.random()*faces.length)];
  el.classList.add('on');
  P.yaw+=(Math.random()-0.5)*1.5;
  setTimeout(()=>{el.classList.remove('on');},600);
  G.sanity=Math.max(0,G.sanity-15);
  updateSanityHUD();
  if(G.sanity<=0) killPlayer('Рассудок не выдержал.');
}
function updateSanityHUD(){
  const w=document.getElementById('sanityWrap');
  if(isHorror()){
    w.style.display='block';
    const s=document.getElementById('sanity');
    s.style.width=G.sanity+'%';
    s.classList.toggle('low',G.sanity<25);
    s.classList.toggle('mid',G.sanity<60&&G.sanity>=25);
  } else w.style.display='none';
}

function spawnNightAnomalies(dt){
  if(!isNight()) return;
  const mul=DIFF[difficulty].anomMul;
  const y=G.floor*FH;
  const h=gameHour();

  if(!findNPC('daywatch') && !G.code1 && Math.random()<dt*0.008*mul){
    spawnNPC('daywatch',X_MAX-5,y,0,'ДНЕВНОЙ СТОРОЖ','anomaly',0x554466,{
      hostile:true,speed:isHorror()?3.0:2.0,state:'chase',
      shirt:0x3a3a48,skin:0xb0b0b0,

function updateSmoke(dt){

    const t=1-c.life/c.maxLife;c.radius=1+t*(c.maxR-1);

    c.group.children.forEach(s=>{

function collide(){
  const r=P.radius;
  const yLo=G.floor*FH+0.2,yHi=G.floor*FH+1.9;
  for(let it=0;it<2;it++){
    let pushed=false;
    for(let ci=0;ci<colliders.length;ci++){
      const b=colliders[ci];
      if(b.maxY<yLo||b.minY>yHi) continue;
      const cx=Math.max(b.minX,Math.min(P.x,b.maxX));
      const cz=Math.max(b.minZ,Math.min(P.z,b.maxZ));
      const dx=P.x-cx,dz=P.z-cz;
      const d2=dx*dx+dz*dz;
      if(d2>=r*r) continue;
      if(d2>1e-6){
        const d=Math.sqrt(d2);
        P.x+=dx/d*(r-d+0.001);
        P.z+=dz/d*(r-d+0.001);
      } else {
        const dL=P.x-b.minX,dR=b.maxX-P.x,dD=P.z-b.minZ,dU=b.maxZ-P.z;
        const m=Math.min(dL,dR,dD,dU);
        if(m===dL)P.x=b.minX-r-0.01;
        else if(m===dR)P.x=b.maxX+r+0.01;
        else if(m===dD)P.z=b.minZ-r-0.01;
        else P.z=b.maxZ+r+0.01;
      }
      pushed=true;
    }
    if(!pushed) break;
  }
}

    if(P.x>r.x0+1.5 && P.x<r.x1-1.5 && P.z>r.z0+1.5 && P.z<r.z1-1.5){

      if(nr){P.x=(nr.x0+nr.x1)/2;P.z=nr.z0+3;}

function updatePrompt(){
  if(isMobile && (performance.now()|0) % 100 < 50) return;
  const list=collect();
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  let best=null,bs=-1;
  for(const it of list){
    const dx=it.pos.x-P.x,dz=it.pos.z-P.z,d=Math.hypot(dx,dz);
    if(d>it.r) continue;
    const dot=(dx*dir.x+dz*dir.z)/(d||1);

    if(sc>bs){bs=sc;best=it;}

  const el=document.getElementById('prompt');

function setupTouch(){
  const jb=document.getElementById('joyBase'),jk=document.getElementById('joyKnob'),lz=document.getElementById('lookZone');
  if(!jb||!lz) return;
  jb.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyActive=t.identifier;joyStart.x=t.clientX;joyStart.y=t.clientY;},{passive:false});
  jb.addEventListener('touchmove',e=>{
    e.preventDefault();if(joyActive===null)return;
    for(const t of e.changedTouches){
      if(t.identifier!==joyActive)continue;
      let dx=t.clientX-joyStart.x,dy=t.clientY-joyStart.y;const d=Math.hypot(dx,dy),max=44;
      if(d>max){dx=dx/d*max;dy=dy/d*max}
      joyVec.x=dx/max;joyVec.y=dy/max;
      jk.style.transform=`translate(${dx}px,${dy}px)`;
    }
  },{passive:false});
  const endJoy=e=>{for(const t of e.changedTouches)if(t.identifier===joyActive){joyActive=null;joyVec.x=joyVec.y=0;jk.style.transform=''}};
  jb.addEventListener('touchend',endJoy);jb.addEventListener('touchcancel',endJoy);
  lz.addEventListener('touchstart',e=>{const t=e.changedTouches[0];lookActive=t.identifier;lookLast.x=t.clientX;lookLast.y=t.clientY;},{passive:true});
  lz.addEventListener('touchmove',e=>{
    if(lookActive===null)return;
    for(const t of e.changedTouches){
      if(t.identifier!==lookActive)continue;
      P.yaw-=(t.clientX-lookLast.x)*0.006*cfg.sens;
      P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-lookLast.y)*0.006*cfg.sens));
      lookLast.x=t.clientX;lookLast.y=t.clientY;
    }
  },{passive:true});
  const endLook=e=>{for(const t of e.changedTouches)if(t.identifier===lookActive)lookActive=null};
  lz.addEventListener('touchend',endLook);lz.addEventListener('touchcancel',endLook);
  const bind=(id,fn)=>{const b=document.getElementById(id);if(!b)return;b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();fn();},{passive:false});b.addEventListener('click',e=>{e.stopPropagation();fn();});};
  bind('btnAct',()=>tryInteract());
  bind('btnVape',()=>useVape());
  bind('btnRadio',()=>openRadio());
  bind('btnTorch',()=>toggleFlashlight());
}

let lastT=0,bobT=0,frameSkip=0,lastFrameTime=0,lastFpsUpdate=0;

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;

  const fpsLimit = FPS_OPTS[cfg.fps];
  if(fpsLimit > 0){
    const interval = 1000/fpsLimit;
    if(now - lastFrameTime < interval - 1.5) return;
    lastFrameTime = now;
  }

  G.fpsFrames++;G.fpsAcc += dt;
  if(now - lastFpsUpdate > 500){
    G.fps=Math.round(G.fpsFrames/((now-lastFpsUpdate)/1000));
    G.fpsFrames=0;lastFpsUpdate=now;
    if(cfg.showFps){
      document.getElementById('fpsVal').textContent=G.fps;
      if(renderer && renderer.info){
        document.getElementById('fpsInfo').textContent =
          'dc:'+renderer.info.render.calls+' tri:'+renderer.info.render.triangles;
      }
    }
  }

  if(!renderer||!scene||!camera) return;

  if(G.running && !G.paused && !G.dead){
    const D=DIFF[difficulty];

    let fw=0,st=0;
    if(keys['KeyW']||keys['ArrowUp']) fw+=1;
    if(keys['KeyS']||keys['ArrowDown']) fw-=1;
    if(keys['KeyD']||keys['ArrowRight']) st+=1;
    if(keys['KeyA']||keys['ArrowLeft']) st-=1;
    if(device==='touch'&&(joyVec.x||joyVec.y)){st+=joyVec.x;fw-=joyVec.y}
    const mag=Math.hypot(fw,st);
    if(mag>1){fw/=mag;st/=mag;}

    const sprint=keys['ShiftLeft'] && G.stam>1 && mag>0.01;
    const speed=sprint?5.5:3.0;

    G.stam=sprint?Math.max(0,G.stam-dt*D.stamRate):Math.min(100,G.stam+dt*D.stamRate*0.65);
    G.hunger=Math.max(0,G.hunger-dt*D.hungRate);
    if(G.hunger<=0) G.stam=Math.max(0,G.stam-dt*8);

    if(isHorror() && D.sanityRate>0){
      let nearAnomaly=false;
      for(const n of npcs){
        if(n.kind!=='anomaly'||!n.hostile) continue;
        const d=Math.hypot(n.obj.position.x-P.x,n.obj.position.z-P.z);
        if(d<8 && Math.abs(n.obj.position.y-G.floor*FH)<2){nearAnomaly=true;break;}
      }
      if(nearAnomaly) G.sanity=Math.max(0,G.sanity-dt*D.sanityRate*2);
      else G.sanity=Math.min(100,G.sanity+dt*0.15);
      updateSanityHUD();
      G.screamerCD-=dt;
      if(G.screamerCD<=0 && Math.random()<dt*0.008) triggerScreamer();
      const hb=document.getElementById('heartbeat');
      if(G.sanity<60) hb.style.opacity=0.3+Math.sin(now*0.005)*0.15;
      else hb.style.opacity=0;
    }

    const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.x+=(fw*(-sy)+st*cy)*speed*dt;
    P.z+=(fw*(-cy)+st*(-sy))*speed*dt;

    collide();
    if(P.x>X_MIN-1 && P.x<X_MAX+1) P.z=Math.max(-Z_ROOM+0.5,Math.min(Z_ROOM-0.5,P.z));
    P.x=Math.max(X_MIN-100+1,Math.min(X_MAX+0.4,P.x));

    G.tpCD=Math.max(0,G.tpCD-dt);
    checkStairs();

    if(P.x<-80){unlock('Бесконечность');endGame('madness','БЕСКОНЕЧНОСТЬ','');}

    bobT+=dt*(sprint?12:8)*(mag>0.01?1:0);
    const bob=(mag>0.01)?Math.sin(bobT)*0.03:0;
    const fY=G.floor*FH;
    camera.position.set(P.x,fY+1.65+bob,P.z);
    camera.rotation.y=P.yaw;
    camera.rotation.x=P.pitch;

    if(G.vapeCD>0) G.vapeCD-=dt;

    frameSkip++;
    if(!isMobile || frameSkip % 2 === 0) updateNPCs(dt*(isMobile?2:1));
    updateSmoke(dt);
    updateSky();
    updatePrompt();
    if(!isMobile || frameSkip % 3 === 0) spawnNightAnomalies(dt*(isMobile?3:1));

    G.dayTime += dt;
    if(G.dayTime >= DAY_SECONDS){
      G.dayTime -= DAY_SECONDS;
      G.day++;
      if(G.day > MAX_DAY){
        unlock('Выживший');
        endGame('survive','ВСЕ 5 ДНЕЙ','Вы выжили!');
        return;
      }
      unlock('День '+G.day);
      toast('☀ День '+G.day+'/5');
      G.fiz={active:false,t:0,jumps:0,done:false};
      G.larionovActive=false;G.amiraSpawned=false;
      G.sanity=Math.min(100,G.sanity+30);
      updateSanityHUD();
      for(const id of ['daywatch','t4b','fizruk_night','anton','director','larionov','amira','maksim']){
        const n=findNPC(id);if(n)removeNPC(n);
      }
    }

    if(G.bell){
      G.bellT-=dt;
      if(G.bellT<=0){G.bell=false;document.getElementById('bellIcon').classList.add('hidden');killPlayer('Звонок.');}
    }
    if(G.larionovActive){
      G.larionovT-=dt;
      if(G.larionovT<=0){G.larionovActive=false;const n=findNPC('larionov');if(n)removeNPC(n);
        if(!G.code1 && !G.dead) killPlayer('Правило 5.');}
    }
    if(G.fiz.active){
      G.fiz.t-=dt;
      if(G.fiz.t<=0){G.fiz.active=false;const n=findNPC('fizruk_night');if(n && !G.fiz.done) killPlayer('Правило 3.');}
    }
    if(G.code1){G.code1T-=dt;if(G.code1T<=0) G.code1=false;}

    document.getElementById('clock').textContent=timeStr();
    document.getElementById('dayBox').textContent='ДЕНЬ '+G.day+'/'+MAX_DAY;
    document.getElementById('stam').style.width=G.stam+'%';
    document.getElementById('hung').style.width=G.hunger+'%';
    document.getElementById('stam').classList.toggle('low',G.stam<25);
    document.getElementById('hung').classList.toggle('low',G.hunger<25);
    const h=gameHour();
    document.getElementById('tbox').classList.toggle('warn',h>=1&&h<5);
  }
  renderer.render(scene,camera);
}

function updateNPCs(dt){
  const lod=cfg.lod;
  const lod2=lod*lod;
  let processed=0;
  const maxNPC=cfg.npcCount;

  for(const n of npcs){
    if(Math.abs(n.obj.position.y-G.floor*FH)>1.5 && n.state!=='chase') continue;
    if(n.noMove) continue;

    const dx0=n.obj.position.x-P.x;
    const dz0=n.obj.position.z-P.z;
    const d2=dx0*dx0+dz0*dz0;

    if(n.kind!=='anomaly' && d2 > (lod*1.5)*(lod*1.5)){
      if(n.visible){n.obj.visible=false;n.visible=false;}
      continue;
    } else if(!n.visible && n.kind!=='anomaly'){
      n.obj.visible=true;n.visible=true;
    }

    if(d2 > lod2 && n.state!=='chase') continue;
    if(processed++ >= maxNPC && n.kind!=='anomaly') continue;

    let slow=1;
    for(const c of G.smoke){
      if(Math.hypot(n.obj.position.x-c.pos.x,n.obj.position.z-c.pos.z)<c.radius && n.kind==='anomaly') slow=0.18;
    }

    if(n.state==='chase' && !G.dead){
      const dx=P.x-n.obj.position.x,dz=P.z-n.obj.position.z;
      const d=Math.hypot(dx,dz);
      if(d>0.01){
        const sp=n.speed*slow*dt;
        n.obj.position.x+=dx/d*sp;
        n.obj.position.z+=dz/d*sp;
      }
      n.obj.rotation.y=Math.atan2(dx,dz);
      if(d<1.1){
        if(n.onContact) n.onContact();
        else killPlayer('Сущность.');
      }
    } else if(n.state==='wander'){
      n.wanderT-=dt;
      if(n.wanderT<=0){
        n.wanderT=2+Math.random()*4;
        n.tx=X_MIN+10+Math.random()*(X_MAX-X_MIN-20);
        n.tz=(Math.random()-0.5)*4;
      }
      const dx=n.tx-n.obj.position.x,dz=n.tz-n.obj.position.z;
      const d=Math.hypot(dx,dz);
      if(d>0.4){
        n.obj.position.x+=dx/d*n.speed*slow*dt;
        n.obj.position.z+=dz/d*n.speed*slow*dt;
        n.obj.rotation.y=Math.atan2(dx,dz);
      }
    }

    if(d2 < 100 && n.state==='chase'){
      n.bob+=dt*9;
      const L=n.obj.userData.limbs;
      if(!n.pose){
        L[0].rotation.x=Math.sin(n.bob)*0.5;
        L[1].rotation.x=-Math.sin(n.bob)*0.5;
        L[2].rotation.x=-Math.sin(n.bob)*0.5;
        L[3].rotation.x=Math.sin(n.bob)*0.5;
      }
    }
  }
}

function pushObj(t){document.getElementById('obj').textContent=t;}
function toast(t){
  const d=document.createElement('div');
  d.className='toast';d.textContent=t;
  document.getElementById('toasts').appendChild(d);
  setTimeout(()=>d.remove(),4000);
}
function unlock(n){
  if(G.ach.has(n)) return;
  G.ach.add(n);toast('🏆 '+n);
}

function startGame(newSeed){
  if(!renderer||!scene){alert('3D не загрузилось.');return;}
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').style.display='block';
  document.getElementById('endPanel').style.display='none';
  document.getElementById('radioPanel').style.display='none';
  document.getElementById('screamer').classList.remove('on');
  document.getElementById('touchUI').classList.toggle('on',device==='touch');

  G.running=true;G.paused=false;G.dead=false;
  G.day=1;G.dayTime=0;G.floor=0;
  G.stam=100;G.hunger=100;G.sanity=100;
  G.bell=false;G.bellT=0;G.code1=false;G.code1T=0;
  G.tpCD=0;G.hasKnife=false;G.hasBun=false;G.vapeCD=0;
  G.fiz={active:false,t:0,jumps:0,done:false};
  G.larionovActive=false;G.larionovT=0;
  G.amiraSpawned=false;G.escapeReady=false;
  G.deaths=0;G.ach.clear();
  G.flashlightOn=true;G.radioOpen=false;
  G.screamerCD=isHorror()?20:999;

  if(newSeed) G.seed=Math.floor(Math.random()*100000)+1;
  buildSchool();

  if(torch) torch.intensity=isHorror()?2.5:1.8;
  scene.children.forEach(ch=>{
    if(ch.isAmbientLight) ch.intensity=isHorror()?0.4:0.85;
    if(ch.isHemisphereLight) ch.intensity=isHorror()?0.35:0.55;
  });

  const post=rooms['0_s_0'];
  P.x=post.cx;P.z=post.cz+3;
  P.yaw=0;P.pitch=0;P.floor=0;

  // ═══════════════════════════════════════════
  // ПРОГУЛЬЩИКИ — сидят в кабинете директора
  // ═══════════════════════════════════════════
  const dirRoom=rooms['0_s_1'];
  if(dirRoom){
    const truantData=[
      {name:'Костя',shirt:0x5060a0,pants:0x303040,skin:0xe8c8a8,
       dialogue:['Костя: «Прогулял 6 уроков…»','«Родителей вызвали.»','«Мамка убьёт.»']},
      {name:'Влад',shirt:0xa05060,pants:0x403050,skin:0xd8b090,
       dialogue:['Влад: «Мы просто в туалете сидели.»','«Ничего не делали!»','«Директор не верит…»']},
      {name:'Стас',shirt:0x60a050,pants:0x303030,skin:0xf0d0b0,
       dialogue:['Стас: «Ну и скукота.»','«Когда предки придут?»','«Хочу домой.»']}
    ];
    for(let k=0;k<3;k++){
      const t=truantData[k];
      const cx=dirRoom.cx-2.5+k*2.5;
      const cz=dirRoom.cz+1.8;
      spawnNPC('truant'+k, cx, 0, cz, t.name, 'truant', t.shirt, {
        shirt:t.shirt, pants:t.pants, skin:t.skin,
        state:'idle', noMove:true, pose:'sit',
        dialogue:t.dialogue
      });
    }
    // Директор тоже есть — за столом, но появляется только в 2:43
    // Пока его нет — только прогульщики ждут
  }

  const trud=rooms['0_s_7'];
  spawnNPC('buhov',trud.cx+2,0,trud.cz-2,'Бухов','staff',0x88a0ff,{
    shirt:0x5a6a9a,pants:0x2a2a3a,skin:0xe0b890,
    state:'idle',noMove:true,
    dialogue:['Бухов: «Держи нож.»']
  });

  const cafe=rooms['0_s_4'];
  spawnNPC('tetya',cafe.cx+2,0,cafe.cz+4,'Тётя Валя','staff',0xffb0c0,{
    shirt:0xffb0c0,pants:0x4a4a5a,
    state:'idle',noMove:true,
    dialogue:['Валя: «Булочка.»']
  });

  const doc=rooms['0_s_2'];
  spawnNPC('doctor1',doc.cx,0,doc.cz+3,'Доктор','staff',0xf0f0f0,{
    shirt:0xf0f0f0,pants:0xf0f0f0,skin:0xe8c0a0,
    state:'idle',noMove:true,
    dialogue:['Доктор: «Как самочувствие?»']
  });

  pushObj('День 1/5. R — рация, F — фонарик.');
  toast('🌙 День 1/5' + (isHorror()?' [ХОРРОР]':''));
  toast('👥 Прогульщики в кабинете директора');
  updateSanityHUD();

  if(!G.rulesShown){
    G.rulesShown=true;
    setTimeout(()=>{document.getElementById('rulesPanel').style.display='flex';},400);
  } else setTimeout(()=>requestLock(),200);
}

const ml=document.getElementById('menuList');
let menuSel=0,screen='main';
function renderMenu(){
  ml.innerHTML='';
  const items=[];
  if(screen==='main'){
    items.push(['▶ НАЧАТЬ СМЕНУ',()=>{screen='setup';renderMenu();}]);
    items.push(['ПРАВИЛА И УПРАВЛЕНИЕ',()=>{
      document.getElementById('rulesPanel').style.display='flex';
      document.getElementById('rulesText').innerHTML=
        '<h3>ЦЕЛЬ: 5 ДНЕЙ × 5 МИНУТ</h3>'+
        '<h3>ПРАВИЛО 1</h3>Сторож → <b>КОД 1</b> (R).<br>'+
        '<h3>ПРАВИЛО 2</h3>Директор 2:43 → помахать (E).<br>'+
        '<h3>ПРАВИЛО 3</h3>Физрук → 4 прыжка.<br>'+
        '<h3>ПРАВИЛО 4</h3>Учитель 4Б.<br>'+
        '<h3>ПРАВИЛО 5</h3>Ларионов → <b>КОД 3</b>.<br>'+
        '<h3>ПРАВИЛО 6</h3>Антон → булочка.<br>'+
        '<h3>ПРАВИЛО 7</h3>Амира и Максим → побег.<br>'+
        '<h3>В КАБИНЕТЕ ДИРЕКТОРА</h3>Сидят 3 прогульщика — Костя, Влад, Стас. Поговори с ними (E).<br>'+
        '<h3>ПК</h3>'+
        '<span class="kbd">WASD</span> движение • <span class="kbd">Мышь</span> обзор • <span class="kbd">Shift</span> бег<br>'+
        '<span class="kbd">E</span> взаимодействие • <span class="kbd">V</span> вейп<br>'+
        '<span class="kbd">R</span> РАЦИЯ • <span class="kbd">F</span> ФОНАРИК • <span class="kbd">Esc</span> пауза<br>'+
        '<h3>ТЕЛЕФОН</h3>Стик + свайп + кнопки.';
    }]);
    items.push(['НАСТРОЙКИ',openSettings]);
    items.push(['ОБ ИГРЕ',()=>alert('ШКОЛА №43 v4\n\n5 дней × 5 минут.\n7 правил. Прогульщики в кабинете директора.')]);
  } else if(screen==='setup'){
    items.push(['— СЛОЖНОСТЬ: '+DIFF[difficulty].label,()=>{
      const arr=['easy','normal','hard','horror'];
      difficulty=arr[(arr.indexOf(difficulty)+1)%4];
      renderMenu();
    }]);
    items.push(['— УСТРОЙСТВО: '+(device==='kbm'?'МЫШЬ':'СЕНСОР'),()=>{
      device=device==='kbm'?'touch':'kbm';
      renderMenu();
    }]);
    if(difficulty==='horror') items.push(['▶ НАЧАТЬ ХОРРОР',()=>{startGame(true);},true]);
    else items.push(['▶ НАЧАТЬ',()=>{startGame(true);}]);
    items.push(['← НАЗАД',()=>{screen='main';renderMenu();}]);
  }
  items.forEach(([t,f,horror],i)=>{
    const b=document.createElement('button');
    b.className='mbtn'+(t[0]==='—'?' small':'')+(horror?' horror':'');
    b.textContent=t;
    b.onmouseenter=()=>{menuSel=i;};
    b.onclick=f;
    ml.appendChild(b);
  });
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('menu').classList.contains('hidden')) return;
  const btns=ml.querySelectorAll('.mbtn');
  if(!btns.length) return;
  if(e.code==='ArrowDown'){menuSel=(menuSel+1)%btns.length;btns[menuSel].focus();e.preventDefault();}
  if(e.code==='ArrowUp'){menuSel=(menuSel-1+btns.length)%btns.length;btns[menuSel].focus();e.preventDefault();}
  if(e.code==='Enter'&&btns[menuSel]) btns[menuSel].click();
});
document.getElementById('rulesOk').onclick=()=>{
  document.getElementById('rulesPanel').style.display='none';
  requestLock();
};

function openSettings(){
  document.getElementById('setPanel').style.display='flex';
  const map={s_sens:'sens',s_fov:'fov',s_bright:'bright',s_dist:'dist',
    s_hud:'hud',s_qual:'qual',s_fps:'fps',s_lod:'lod',s_npc:'npcCount',s_showfps:'showFps'};
  for(const id in map){
    const el=document.getElementById(id);if(!el) continue;
    el.value=cfg[map[id]];
    document.getElementById('v_'+map[id]).textContent=cfg[map[id]];
    el.oninput=e=>{
      cfg[map[id]]=parseFloat(e.target.value);
      document.getElementById('v_'+map[id]).textContent=e.target.value;
      applyS();localStorage.setItem('sh43v4',JSON.stringify(cfg));
    };
  }
}
document.getElementById('setBack').onclick=()=>document.getElementById('setPanel').style.display='none';
document.getElementById('setReset').onclick=()=>{
  cfg=Object.assign({},DEF);applyS();
  localStorage.setItem('sh43v4',JSON.stringify(cfg));
  openSettings();
};
function applyS(){
  if(camera){camera.fov=cfg.fov;camera.updateProjectionMatrix();}
  if(scene){scene.fog.far=cfg.dist;}
  document.getElementById('hud').style.fontSize=(13*cfg.hud)+'px';
  if(renderer){
    const pr = isMobile ? 0.75 : PR_OPTS[cfg.qual];
    renderer.setPixelRatio(pr);
    renderer.setSize(innerWidth,innerHeight);
  }
  document.getElementById('fps').style.display=cfg.showFps?'block':'none';
}

addEventListener('resize',()=>{
  if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  if(renderer) renderer.setSize(innerWidth,innerHeight);
});

renderMenu();
setupTouch();

try {
  initThree();
  initMaterials();
  applyS();
  G.seed=Math.floor(Math.random()*100000)+1;
  buildSchool();
  menuSel=0;
  renderMenu();
  requestAnimationFrame(t=>{lastT=t;lastFrameTime=t;lastFpsUpdate=t;loop(t);});
} catch(err){
  console.error('3D init failed:', err);
  window.__3dError = err;
}
</script>

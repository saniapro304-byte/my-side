<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spacegram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0e1621;
    --panel: #17212b;
    --panel2: #242f3d;
    --hover: #1c2733;
    --border: #242f3d;
    --accent: #64b5ef;
    --accent-bg: #2b5278;
    --accent-hover: #3a6a94;
    --text: #fff;
    --text2: #7d8b99;
    --text3: #5d7285;
    --msg-in: #182533;
    --msg-out: #2b5278;
    --green: #4ade80;
    --red: #e74c3c;
    --blue-grad: linear-gradient(135deg, #4a9eff, #2b7fff);
    --red-grad: linear-gradient(135deg, #ff4a4a, #e60000);
    --shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  body.light {
    --bg: #e8eef5;
    --panel: #ffffff;
    --panel2: #f0f3f7;
    --hover: #e8eef5;
    --border: #e0e6ed;
    --text: #0e1621;
    --text2: #5d7285;
    --msg-in: #ffffff;
    --msg-out: #64b5ef;
    --shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  body { background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; transition: background 0.3s; color: var(--text); }
  button { font-family: inherit; }

  .app { width: 100%; max-width: 1000px; height: 100vh; max-height: 750px; display: flex; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); transition: background 0.3s; }
  @media (min-width: 768px) { .app { border-radius: 20px; height: 750px; } }

  /* AUTH */
  .auth-screen {
    width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 30px; gap: 14px; background: var(--panel); position: relative; overflow: hidden;
  }
  .auth-screen::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(100,181,239,0.15), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(43,82,120,0.3), transparent 40%);
    animation: bgFloat 20s ease-in-out infinite;
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0,0) rotate(0); }
    50% { transform: translate(5%, 5%) rotate(180deg); }
  }
  .auth-screen > * { position: relative; z-index: 1; }
  .auth-screen h1 {
    font-size: 40px; margin-bottom: 20px; letter-spacing: -1px;
    background: linear-gradient(135deg, #64b5ef, #4a9eff, #7dd3fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-weight: 800;
  }
  .auth-screen input {
    width: 100%; max-width: 340px; padding: 16px 20px; border: 2px solid transparent;
    border-radius: 14px; background: var(--panel2); color: var(--text);
    outline: none; font-size: 15px; transition: 0.2s;
  }
  .auth-screen input:focus { border-color: var(--accent); }
  .auth-screen input::placeholder { color: var(--text3); }
  .auth-screen button {
    width: 100%; max-width: 340px; padding: 16px; border: none; border-radius: 14px;
    background: var(--accent-bg); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: 0.2s;
  }
  .auth-screen button:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .auth-screen button.ghost { background: var(--panel2); color: var(--text); }
  .auth-screen button.ghost:hover { background: var(--hover); }
  .auth-screen .error { color: var(--red); font-size: 13px; min-height: 18px; text-align: center; max-width: 340px; }
  .auth-screen .hint { color: var(--text3); font-size: 12px; text-align: center; max-width: 340px; }

  /* MAIN */
  .main-app { display: none; width: 100%; height: 100%; }
  .main-app.active { display: flex; }

  /* SIDEBAR */
  .sidebar { width: 340px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: background 0.3s; }
  @media (max-width: 700px) { .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; } .sidebar.hidden { display: none; } }

  .sidebar-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sidebar-header h2 { font-size: 20px; font-weight: 700; cursor: pointer; user-select: none; background: linear-gradient(135deg, #64b5ef, #4a9eff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .header-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--panel2); border: none; color: var(--accent); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .header-btn:hover { background: var(--accent-bg); color: #fff; transform: scale(1.05); }
  .user-avatar-small { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; overflow: hidden; color: #fff; font-weight: 600; transition: 0.2s; border: 2px solid transparent; }
  .user-avatar-small:hover { border-color: var(--accent); }
  .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }

  .search-box { padding: 6px 16px 12px; }
  .search-box input { width: 100%; padding: 11px 16px; border: 2px solid transparent; border-radius: 12px; background: var(--panel2); color: var(--text); outline: none; font-size: 14px; transition: 0.2s; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text3); }

  .chat-list { flex: 1; overflow-y: auto; padding: 0 6px 6px; }
  .chat-list::-webkit-scrollbar { width: 5px; }
  .chat-list::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }
  .chat-item { padding: 11px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.15s; border-radius: 12px; margin: 2px 0; position: relative; }
  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--accent-bg); }
  .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; color: #fff; font-weight: 600; position: relative; }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .online-dot { position: absolute; bottom: 1px; right: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--green); border: 2.5px solid var(--panel); box-shadow: 0 0 6px rgba(74,222,128,0.6); }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-preview { color: var(--text2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chat-time { color: var(--text3); font-size: 11px; }
  .unread-badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; min-width: 22px; text-align: center; animation: bounceIn 0.3s; }
  @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* BADGES */
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; font-size: 10px; font-weight: bold; color: #fff; }
  .badge.verified { background: var(--blue-grad); }
  .badge.creator { background: var(--red-grad); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 6px rgba(255,74,74,0.6); } 50% { box-shadow: 0 0 14px rgba(255,74,74,1); } }

  /* CHAT AREA */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; transition: background 0.3s; }
  .chat-header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: background 0.3s; }
  .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; padding: 0 8px; }
  @media (max-width: 700px) { .back-btn { display: block; } }
  .header-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; color: #fff; font-weight: 600; position: relative; cursor: pointer; }
  .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .header-info { cursor: pointer; flex: 1; min-width: 0; }
  .header-info h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .header-info .status { color: var(--accent); font-size: 12px; margin-top: 1px; }
  .chat-actions { display: flex; gap: 4px; }
  .chat-actions button { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; }
  .chat-actions button:hover { background: var(--panel2); }

  .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; position: relative; background-image: radial-gradient(circle at 20% 30%, rgba(100,181,239,0.03), transparent 50%), radial-gradient(circle at 80% 70%, rgba(43,82,120,0.05), transparent 50%); }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }

  .date-divider { align-self: center; padding: 4px 12px; background: var(--panel); color: var(--text2); border-radius: 12px; font-size: 12px; margin: 12px 0 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }

  .msg-wrap { display: flex; flex-direction: column; max-width: 75%; position: relative; }
  .msg-wrap.me { align-self: flex-end; }
  .msg-wrap.you { align-self: flex-start; }
  .msg { padding: 8px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; animation: pop 0.2s ease; position: relative; cursor: pointer; }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .msg.me { background: var(--msg-out); color: #fff; border-bottom-right-radius: 5px; }
  .msg.you { background: var(--msg-in); color: var(--text); border-bottom-left-radius: 5px; }
  .msg .time { font-size: 10.5px; opacity: 0.7; margin-top: 3px; text-align: right; display: inline-flex; align-items: center; gap: 3px; float: right; margin-left: 8px; }
  .msg.me .time { color: rgba(255,255,255,0.7); }
  .msg.you .time { color: var(--text3); }
  .msg .check { font-size: 13px; }
  .msg .check.read { color: #4ade80; }
  .msg.deleted { opacity: 0.5; font-style: italic; }
  .msg.edited::after { content: ' (изм.)'; font-size: 10px; opacity: 0.5; }
  .msg .reply-to { border-left: 3px solid var(--accent); padding: 4px 8px; margin-bottom: 6px; background: rgba(100,181,239,0.1); border-radius: 6px; font-size: 12px; }
  .msg .reply-to .author { color: var(--accent); font-weight: 600; }
  .msg img.msg-img { max-width: 100%; border-radius: 10px; margin: -4px -8px; display: block; cursor: pointer; }
  .msg .file-box { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .msg .file-box .file-icon { font-size: 28px; }
  .msg .file-box .file-info { flex: 1; min-width: 0; }
  .msg .file-box .file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .file-box .file-size { font-size: 11px; opacity: 0.7; }

  .msg-toolbar { position: absolute; top: 50%; transform: translateY(-50%); display: none; gap: 4px; background: var(--panel); border-radius: 20px; padding: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); z-index: 20; }
  .msg-wrap.me .msg-toolbar { left: -110px; }
  .msg-wrap.you .msg-toolbar { right: -110px; }
  .msg-wrap.show-toolbar .msg-toolbar { display: flex; animation: pop 0.15s; }
  .msg-toolbar button { background: none; border: none; cursor: pointer; padding: 6px 9px; border-radius: 50%; font-size: 15px; transition: 0.15s; }
  .msg-toolbar button:hover { background: var(--panel2); transform: scale(1.15); }

  .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .reaction { background: var(--panel); border-radius: 12px; padding: 3px 8px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center; gap: 3px; transition: 0.15s; }
  .reaction:hover { transform: scale(1.1); background: var(--accent-bg); border-color: var(--accent); }
  .reaction.mine { background: var(--accent-bg); border-color: var(--accent); }

  .typing-indicator { padding: 6px 16px 0; color: var(--accent); font-size: 13px; font-style: italic; min-height: 0; overflow: hidden; transition: 0.2s; }
  .typing-indicator.show { min-height: 22px; padding-bottom: 6px; }

  .pinned-banner { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
  .pinned-banner .pin-icon { color: var(--accent); font-size: 16px; }
  .pinned-banner .pin-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
  .pinned-banner .pin-text b { color: var(--text); }
  .pinned-banner button { background: none; border: none; color: var(--text2); font-size: 16px; cursor: pointer; }

  .input-area { padding: 10px 14px; background: var(--panel); display: flex; gap: 8px; align-items: center; transition: background 0.3s; }
  .input-area input { flex: 1; padding: 12px 18px; border: none; border-radius: 24px; background: var(--panel2); color: var(--text); outline: none; font-size: 14.5px; transition: 0.2s; }
  .input-area input::placeholder { color: var(--text3); }
  .icon-btn { width: 44px; height: 44px; border: none; border-radius: 50%; background: var(--panel2); color: var(--accent); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--accent-bg); color: #fff; transform: scale(1.05); }
  .send-btn { background: var(--accent-bg); color: #fff; }
  .send-btn:hover { background: var(--accent-hover); }

  .emoji-picker-container { position: relative; }
  emoji-picker { position: absolute; bottom: 54px; right: 0; z-index: 100; --background: var(--panel); --border-color: var(--border); --indicator-color: var(--accent); --input-border-color: var(--border); --input-background: var(--panel2); --input-color: var(--text); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 15px; text-align: center; padding: 20px; flex-direction: column; gap: 12px; }
  .empty-state .icon { font-size: 64px; opacity: 0.4; }

  /* REPLIES PREVIEW */
  .reply-preview { padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border); display: none; align-items: center; gap: 10px; font-size: 13px; }
  .reply-preview.show { display: flex; }
  .reply-preview .bar { width: 3px; height: 34px; background: var(--accent); border-radius: 2px; }
  .reply-preview .content { flex: 1; min-width: 0; }
  .reply-preview .content .author { color: var(--accent); font-weight: 600; font-size: 12px; }
  .reply-preview .content .text { color: var(--text2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reply-preview button { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }

  /* MODALS */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
  .modal.active { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content { background: var(--panel); padding: 26px; border-radius: 20px; width: 100%; max-width: 460px; color: var(--text); display: flex; flex-direction: column; gap: 12px; margin: auto; animation: slideUp 0.25s; box-shadow: 0 20px 60px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-content::-webkit-scrollbar { width: 5px; }
  .modal-content::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }
  .modal-content h2 { font-size: 22px; margin-bottom: 6px; font-weight: 700; }
  .modal-content input, .modal-content textarea, .modal-content select { padding: 13px 16px; border: 2px solid transparent; border-radius: 12px; background: var(--panel2); color: var(--text); outline: none; font-size: 14px; width: 100%; font-family: inherit; resize: vertical; transition: 0.2s; }
  .modal-content input:focus, .modal-content textarea:focus { border-color: var(--accent); }
  .modal-content button { padding: 13px; border: none; border-radius: 12px; background: var(--accent-bg); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .modal-content button:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .modal-content button.danger { background: var(--red); }
  .modal-content button.ghost { background: var(--panel2); color: var(--text); }
  .modal-content button.blue { background: var(--blue-grad); }
  .modal-content .avatar-preview { width: 110px; height: 110px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 42px; margin: 0 auto; overflow: hidden; font-weight: 600; position: relative; cursor: pointer; }
  .modal-content .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-preview .edit-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; cursor: pointer; transition: 0.2s; font-size: 28px; }
  .avatar-preview:hover .edit-overlay { opacity: 1; }

  .modal-content .section-title { font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-top: 8px; letter-spacing: 1px; }
  .modal-content .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; background: var(--panel2); border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .modal-content .setting-row:hover { background: var(--hover); }
  .setting-row .label { font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .setting-row .value { font-size: 13px; color: var(--text2); }

  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #444; border-radius: 26px; cursor: pointer; transition: 0.3s; }
  .switch .slider::before { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; left: 3px; top: 3px; transition: 0.3s; }
  .switch input:checked + .slider { background: #2b7fff; }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .admin-user { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--panel2); border-radius: 12px; margin-top: 6px; transition: 0.15s; }
  .admin-user:hover { background: var(--hover); }
  .admin-user .info { flex: 1; min-width: 0; }
  .admin-user .uname { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .admin-user .nick { color: var(--text2); font-size: 12px; }
  .admin-user .btn-mini { padding: 7px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; transition: 0.2s; }
  .admin-user .btn-mini:hover { transform: scale(1.05); }
  .admin-user .btn-blue { background: var(--blue-grad); }
  .admin-user .btn-blue.off { background: #444; }

  .user-profile-view { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 10px 0; }
  .user-profile-view .avatar-lg { width: 120px; height: 120px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; font-weight: 600; box-shadow: 0 8px 24px rgba(100,181,239,0.3); }
  .user-profile-view .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
  .user-profile-view .name-lg { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .user-profile-view .nick-lg { color: var(--accent); font-size: 14px; }
  .user-profile-view .bio-lg { color: var(--text2); font-size: 14px; margin-top: 6px; max-width: 320px; }
  .user-profile-view .status-lg { color: var(--text2); font-size: 12px; }
  .user-profile-view .actions { display: flex; gap: 8px; width: 100%; margin-top: 8px; }

  .toggle-group { display: flex; gap: 8px; }
  .toggle-group button { flex: 1; padding: 11px; background: var(--panel2); border-radius: 10px; border: 2px solid transparent; color: var(--text); font-size: 13px; cursor: pointer; transition: 0.2s; }
  .toggle-group button:hover { background: var(--hover); }
  .toggle-group button.active { background: var(--accent-bg); border-color: var(--accent); color: #fff; }

  .img-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
  .img-viewer.active { display: flex; }
  .img-viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .img-viewer .close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; background: rgba(0,0,0,0.5); border: none; width: 44px; height: 44px; border-radius: 50%; }

  .search-messages-bar { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: none; gap: 8px; align-items: center; }
  .search-messages-bar.show { display: flex; }
  .search-messages-bar input { flex: 1; padding: 10px 14px; border: none; border-radius: 10px; background: var(--panel2); color: var(--text); outline: none; font-size: 14px; }
  .search-messages-bar button { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; }
  .msg.highlight { animation: highlight 1s; }
  @keyframes highlight { 0% { background: #ffeb3b; } 100% { background: inherit; } }

  .group-members { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
  .group-member { display: flex; align-items: center; gap: 6px; background: var(--panel2); padding: 5px 10px; border-radius: 20px; font-size: 12px; }
  .group-member img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- AUTH -->
  <div class="auth-screen" id="authScreen">
    <h1>🚀 Spacegram</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
    <input type="text" id="usernameInput" placeholder="@username (латиница, цифры)">
    <div class="error" id="authError"></div>
    <button id="loginBtn">Войти</button>
    <button class="ghost" id="registerBtn">Зарегистрироваться</button>
    <div class="hint">Username: только a-z, 0-9, _ (мин. 3 символа)</div>
  </div>

  <!-- MAIN -->
  <div class="main-app" id="mainApp">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 id="logo">💬 Spacegram</h2>
        <div class="header-actions">
          <button class="header-btn" id="newChatBtn" title="Новый чат">✏️</button>
          <button class="header-btn" id="newGroupBtn" title="Новая группа">👥</button>
          <button class="header-btn" id="settingsBtn" title="Настройки">⚙️</button>
          <div class="user-avatar-small" id="myAvatar" onclick="openProfileModal()">?</div>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по @username...">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader" style="display:none">
        <button class="back-btn" onclick="showSidebar()">←</button>
        <div class="header-avatar" id="headerAvatar">?</div>
        <div class="header-info" onclick="openUserProfile(currentChatUser)">
          <h3 id="headerName">—</h3>
          <div class="status" id="headerStatus"></div>
        </div>
        <div class="chat-actions">
          <button id="searchMsgBtn" title="Поиск по сообщениям">🔍</button>
          <button id="chatMenuBtn" title="Меню">⋮</button>
        </div>
      </div>

      <div class="pinned-banner" id="pinnedBanner" style="display:none">
        <span class="pin-icon">📌</span>
        <div class="pin-text" id="pinnedText"></div>
        <button id="unpinBtn">✕</button>
      </div>

      <div class="search-messages-bar" id="searchMessagesBar">
        <input type="text" id="searchMessagesInput" placeholder="Поиск в чате...">
        <button id="closeSearchMsg">✕</button>
      </div>

      <div class="messages" id="messages" style="display:none"></div>
      <div class="typing-indicator" id="typingIndicator"></div>

      <div class="reply-preview" id="replyPreview">
        <div class="bar"></div>
        <div class="content">
          <div class="author" id="replyAuthor"></div>
          <div class="text" id="replyText"></div>
        </div>
        <button id="cancelReplyBtn">✕</button>
      </div>

      <div class="input-area" id="inputArea" style="display:none">
        <div class="emoji-picker-container">
          <button class="icon-btn" id="emojiBtn">😀</button>
          <emoji-picker id="emojiPicker" locale="ru" style="display:none"></emoji-picker>
        </div>
        <button class="icon-btn" id="attachBtn" title="Прикрепить">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение...">
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="icon">💬</div>
        <div>Выбери чат или найди пользователя 🔍</div>
      </div>
    </div>
  </div>
</div>

<!-- IMAGE VIEWER -->
<div class="img-viewer" id="imgViewer">
  <button class="close" onclick="document.getElementById('imgViewer').classList.remove('active')">✕</button>
  <img id="imgViewerImg" src="">
</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>Мой профиль</h2>
    <div class="avatar-preview" id="avatarPreview">?<div class="edit-overlay">📷</div></div>
    <div class="section-title">Основное</div>
    <input type="text" id="profileName" placeholder="Имя">
    <input type="text" id="profileUsername" placeholder="@username" disabled style="opacity:0.6">
    <input type="text" id="profilePhone" placeholder="Телефон">
    <textarea id="profileBio" placeholder="О себе..." rows="3"></textarea>
    <button id="saveProfileBtn">💾 Сохранить</button>
    <button class="danger" id="logoutBtn">🚪 Выйти</button>
    <button class="ghost" id="closeProfileBtn">Закрыть</button>

</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2>⚙️ Настройки</h2>
    <div class="section-title">Внешний вид</div>
    <div class="toggle-group" id="themeToggle">
      <button data-theme="dark">🌙 Тёмная</button>
      <button data-theme="light">☀️ Светлая</button>

    <div class="section-title">Уведомления</div>
    <div class="setting-row">
      <div class="label">🔔 Уведомления</div>
      <label class="switch"><input type="checkbox" id="notifToggle" checked><span class="slider"></span></label>

    <div class="setting-row">
      <div class="label">✓✓ Отчёты о прочтении</div>

    <div class="section-title">Данные</div>
    <button class="ghost" id="clearChatsBtn">🗑 Очистить все чаты</button>
    <button class="ghost" id="closeSettingsBtn">Закрыть</button>
  </div>
</div>

<!-- USER PROFILE MODAL -->
<div class="modal" id="userProfileModal">
  <div class="modal-content" id="userProfileContent"></div>
</div>

<!-- GROUP MODAL -->
<div class="modal" id="groupModal">
  <div class="modal-content">
    <h2>👥 Новая группа</h2>
    <input type="text" id="groupNameInput" placeholder="Название группы">
    <input type="text" id="groupSearchInput" placeholder="Поиск участников...">
    <div id="groupSearchResults" style="max-height:220px;overflow-y:auto"></div>
    <div id="groupSelected" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <button id="createGroupBtn">Создать группу</button>
    <button class="ghost" onclick="document.getElementById('groupModal').classList.remove('active')">Отмена</button>

</div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h2>🔐 Админ-панель</h2>
    <div id="adminLoginSection">
      <input type="password" id="adminSecret" placeholder="Секретный пароль">
      <div class="error" id="adminError" style="color:#e74c3c;font-size:13px;min-height:18px;text-align:center;margin-top:8px"></div>
      <button id="adminLoginBtn" style="width:100%;margin-top:8px">Войти как админ</button>
    </div>
    <div id="adminPanelSection" style="display:none">
      <input type="text" id="adminSearchUser" placeholder="Поиск @username...">
      <div id="adminUserList" style="max-height:300px;overflow-y:auto;margin-top:10px"></div>
      <button class="ghost" id="adminLogoutBtn" style="margin-top:12px">Выйти из админки</button>
    </div>
    <button class="ghost" id="adminCloseBtn">Закрыть</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import "https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js";

const SUPABASE_URL = "https://qtuvtxbxtypvttfjiydv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0dXZ0eGJ4dHlwdnR0ZmppeWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDg1NzEsImV4cCI6MjEwNjY4NDU3MX0.hxLhZNqjMoxJmGDgNdfb8eiFg3yGBKwwkioZJG74EpA";
const ADMIN_SECRET = "spacegram2026";
const CREATOR_USERNAME = "itzrealsaneghka";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentChatUser = null;
let currentChatObj = null;
let messagesChannel = null;
let chatsChannel = null;
let reactionsChannel = null;
let isAdmin = false;
let replyTo = null;
let settings = JSON.parse(localStorage.getItem('spacegram_settings') || '{}');
let allMessages = [];
let userCache = {};
let typingTimer = null;
let selectedMembers = [];

const $ = id => document.getElementById(id);

// ============ SETTINGS ============
function applyTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
}
function saveSettings() { localStorage.setItem('spacegram_settings', JSON.stringify(settings)); }

// ============ BADGES ============
function renderBadges(p) {
  let h = '';
  if (p?.is_creator) h += '<span class="badge creator" title="Создатель">★</span>';
  else if (p?.is_verified) h += '<span class="badge verified" title="Подтверждён">✓</span>';
  return h;
}

// ============ AUTH ============
async function initAuth() {
  applyTheme(settings.theme || 'dark');
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; await enterApp(); }
  else showAuth();
}
function showAuth() { $('authScreen').style.display = 'flex'; $('mainApp').classList.remove('active'); }
async function enterApp() {
  $('authScreen').style.display = 'none';
  $('mainApp').classList.add('active');
  await loadProfile();
  await checkAdmin();
  await loadChats();
  subscribeChats();
}

$('registerBtn').onclick = async () => {
  $('authError').textContent = '';
  const email = $('email').value.trim();
  const pass = $('password').value;
  let uname = $('usernameInput').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!email || !pass) return $('authError').textContent = 'Заполни email и пароль';
  if (pass.length < 6) return $('authError').textContent = 'Пароль мин. 6 символов';
  if (uname.length < 3) return $('authError').textContent = 'Username мин. 3 символа';
  const { data: ex } = await sb.from('profiles').select('id').eq('username', uname).maybeSingle();
  if (ex) return $('authError').textContent = 'Этот @username занят';
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) return $('authError').textContent = error.message;
  if (!data.user) return $('authError').textContent = 'Ошибка регистрации';
  const isCreator = uname === CREATOR_USERNAME;
  await sb.from('profiles').insert({
    id: data.user.id, username: uname, display_name: uname,
    avatar_url: null, is_creator: isCreator, is_verified: isCreator,
    last_seen: new Date().toISOString()
  });
  currentUser = data.user;
  await enterApp();
};

$('loginBtn').onclick = async () => {
  $('authError').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return $('authError').textContent = error.message;
  currentUser = data.user;
  await enterApp();
};

// ============ PROFILE ============
async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (!data) return;
  currentProfile = data;
  const a = $('myAvatar');
  if (data.avatar_url) a.innerHTML = `<img src="${data.avatar_url}">`;
  else a.textContent = (data.display_name || '?')[0].toUpperCase();
  // heartbeat
  sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  setInterval(() => sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id), 30000);
}

window.openProfileModal = () => {
  if (!currentProfile) return;
  $('profileName').value = currentProfile.display_name || '';
  $('profileUsername').value = '@' + currentProfile.username;
  $('profilePhone').value = currentProfile.phone || '';
  $('profileBio').value = currentProfile.bio || '';
  const prev = $('avatarPreview');
  const img = currentProfile.avatar_url ? `<img src="${currentProfile.avatar_url}">` : (currentProfile.display_name||'?')[0].toUpperCase();
  prev.innerHTML = img + '<div class="edit-overlay">📷</div>';
  $('profileModal').classList.add('active');
};
$('closeProfileBtn').onclick = () => $('profileModal').classList.remove('active');

$('avatarPreview').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) return alert('Файл > 3 МБ');
    const path = `${currentUser.id}/avatar_${Date.now()}.jpg`;
    const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
    if (error) return alert(error.message);
    const { data: u } = sb.storage.from('avatars').getPublicUrl(path);
    await sb.from('profiles').update({ avatar_url: u.publicUrl }).eq('id', currentUser.id);
    currentProfile.avatar_url = u.publicUrl;
    await loadProfile();
    $('avatarPreview').innerHTML = `<img src="${u.publicUrl}"><div class="edit-overlay">📷</div>`;
  };
  inp.click();
};

$('saveProfileBtn').onclick = async () => {
  const name = $('profileName').value.trim();
  if (!name) return;
  await sb.from('profiles').update({
    display_name: name,
    phone: $('profilePhone').value.trim(),
    bio: $('profileBio').value.trim()
  }).eq('id', currentUser.id);
  await loadProfile();
  $('profileModal').classList.remove('active');
};

$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ============ SETTINGS ============
$('settingsBtn').onclick = () => {
  $('notifToggle').checked = settings.notifications !== false;
  $('readReceiptsToggle').checked = settings.readReceipts !== false;
  $('enterSendToggle').checked = settings.enterSend !== false;
  applyTheme(settings.theme || 'dark');
  $('settingsModal').classList.add('active');
};
$('closeSettingsBtn').onclick = () => $('settingsModal').classList.remove('active');
$('themeToggle').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  settings.theme = btn.dataset.theme;
  applyTheme(settings.theme); saveSettings();
};
$('notifToggle').onchange = e => { settings.notifications = e.target.checked; saveSettings(); };
$('readReceiptsToggle').onchange = e => { settings.readReceipts = e.target.checked; saveSettings(); };
$('enterSendToggle').onchange = e => { settings.enterSend = e.target.checked; saveSettings(); };

$('clearChatsBtn').onclick = async () => {
  if (!confirm('Удалить ВСЕ твои чаты и сообщения?')) return;
  const uid = currentUser.id;
  const { data: chats } = await sb.from('chats').select('id').or(`user1.eq.${uid},user2.eq.${uid}`);
  for (const c of chats || []) {
    await sb.from('messages').delete().eq('chat_id', c.id);
    await sb.from('chats').delete().eq('id', c.id);
  }
  await loadChats();
  $('settingsModal').classList.remove('active');
};

// ============ CHATS ============
async function getUser(uid) {
  if (userCache[uid]) return userCache[uid];
  const { data } = await sb.from('profiles').select('*').eq('id', uid).single();
  if (data) userCache[uid] = data;
  return data;
}

async function loadChats() {
  const uid = currentUser.id;
  const { data: chats } = await sb.from('chats').select('*').or(`user1.eq.${uid},user2.eq.${uid}`).order('created_at', { ascending: false });
  const list = $('chatList');
  list.innerHTML = '';
  if (!chats || chats.length === 0) {
    list.innerHTML = '<div style="padding:30px 20px;color:var(--text2);text-align:center;font-size:14px">Нет чатов<br>Найди пользователя 🔍</div>';
    return;
  }
  for (const chat of chats) {
    let prof, otherId;
    if (chat.is_group) {
      prof = { display_name: chat.group_name || 'Группа', avatar_url: chat.group_avatar };
      otherId = null;
    } else {
      otherId = chat.user1 === uid ? chat.user2 : chat.user1;
      prof = await getUser(otherId);
      if (!prof) continue;
    }
    const isOnline = prof.last_seen && (Date.now() - new Date(prof.last_seen).getTime()) < 60000;
    const div = document.createElement('div');
    div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
    div.onclick = () => openChat(chat.id, otherId);
    const time = chat.created_at ? new Date(chat.created_at).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'}) : '';
    div.innerHTML = `
      <div class="chat-avatar">
        ${prof.avatar_url ? `<img src="${prof.avatar_url}">` : (prof.display_name||'?')[0].toUpperCase()}
        ${isOnline && !chat.is_group ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(prof.display_name)} ${renderBadges(prof)} ${chat.is_group ? '👥' : ''}</div>
        <div class="chat-preview">${escapeHtml(chat.last_message || 'Начни общение')}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${time}</div>
      </div>`;
    list.appendChild(div);
  }
}

function subscribeChats() {
  if (chatsChannel) sb.removeChannel(chatsChannel);
  chatsChannel = sb.channel('chats_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'chats' }, () => loadChats())
    .subscribe();
}

// ============ SEARCH ============
$('searchInput').oninput = async (e) => {
  const val = e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  const list = $('chatList');
  if (!val || val.length < 2) { loadChats(); return; }
  const { data } = await sb.from('profiles').select('*').eq('username', val);
  list.innerHTML = '';
  if (!data || data.length === 0) {
    list.innerHTML = '<div style="padding:20px;color:var(--text2);text-align:center;font-size:14px">Не найден</div>';
    return;
  }
  data.forEach(u => {
    if (u.id === currentUser.id) { list.innerHTML += '<div style="padding:20px;color:var(--text2);text-align:center;font-size:14px">Это ты 🙂</div>'; return; }
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `
      <div class="chat-avatar">${u.avatar_url ? `<img src="${u.avatar_url}">` : (u.display_name||'?')[0].toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(u.display_name)} ${renderBadges(u)}</div>
        <div class="chat-preview">@${escapeHtml(u.username)}</div>
      </div>`;
    div.onclick = () => startChat(u.id);
    list.appendChild(div);
  });
};

async function startChat(otherId) {
  const uid = currentUser.id;
  const [u1, u2] = [uid, otherId].sort();
  let { data: ex } = await sb.from('chats').select('*').eq('user1', u1).eq('user2', u2).maybeSingle();
  if (!ex) {
    const { data, error } = await sb.from('chats').insert({ user1: u1, user2: u2, created_by: uid }).select().single();
    if (error) return alert(error.message);
    ex = data;
  }
  $('searchInput').value = '';
  await loadChats();
  openChat(ex.id, otherId);
}

// ============ OPEN CHAT ============
async function openChat(chatId, otherId) {
  currentChatId = chatId;
  currentChatUser = otherId;
  const { data: chat } = await sb.from('chats').select('*').eq('id', chatId).single();
  currentChatObj = chat;
  $('sidebar').classList.add('hidden');
  $('chatHeader').style.display = 'flex';
  $('messages').style.display = 'flex';
  $('inputArea').style.display = 'flex';
  $('emptyState').style.display = 'none';

  if (chat.is_group) {
    $('headerName').innerHTML = `${escapeHtml(chat.group_name || 'Группа')} 👥`;
    $('headerStatus').textContent = 'группа';
    $('headerAvatar').innerHTML = chat.group_avatar ? `<img src="${chat.group_avatar}">` : '👥';
  } else {
    const prof = await getUser(otherId);
    $('headerName').innerHTML = `${escapeHtml(prof?.display_name || 'Пользователь')} ${renderBadges(prof || {})}`;
    const isOnline = prof?.last_seen && (Date.now() - new Date(prof.last_seen).getTime()) < 60000;
    $('headerStatus').textContent = isOnline ? 'в сети' : 'был(а) недавно';
    $('headerAvatar').innerHTML = prof?.avatar_url ? `<img src="${prof.avatar_url}">` : (prof?.display_name||'?')[0].toUpperCase();
  }

  await loadMessages(chatId);
  renderPinned();

  if (messagesChannel) sb.removeChannel(messagesChannel);
  if (reactionsChannel) sb.removeChannel(reactionsChannel);
  messagesChannel = sb.channel('msgs_' + chatId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` },
      (payload) => {
        if (payload.eventType === 'INSERT') appendMessage(payload.new);
        if (payload.eventType === 'UPDATE') loadMessages(chatId);
      })
    .subscribe();
  reactionsChannel = sb.channel('reactions_' + chatId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => renderReactions())
    .subscribe();
}

async function loadMessages(chatId) {
  const { data } = await sb.from('messages').select('*').eq('chat_id', chatId).order('created_at');
  allMessages = data || [];
  const msgs = $('messages');
  msgs.innerHTML = '';
  let lastDate = '';
  allMessages.forEach(m => {
    const d = new Date(m.created_at).toLocaleDateString('ru');
    if (d !== lastDate) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = formatDate(new Date(m.created_at));
      msgs.appendChild(div);
      lastDate = d;
    }
    appendMessage(m, false);
  });
  await loadAllReactions();
  msgs.scrollTop = msgs.scrollHeight;
  if (settings.readReceipts !== false) {
    await sb.from('messages').update({ is_read: true }).eq('chat_id', chatId).neq('sender', currentUser.id).eq('is_read', false);
  }
}

function formatDate(d) {
  const today = new Date();
  const y = new Date(today); y.setDate(y.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Сегодня';
  if (d.toDateString() === y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
}

function appendMessage(m, scroll = true) {
  const msgs = $('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (m.sender === currentUser.id ? 'me' : 'you');
  wrap.dataset.msgId = m.id;

  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === currentUser.id ? 'me' : 'you');
  if (m.deleted) div.classList.add('deleted');
  if (m.edited_at) div.classList.add('edited');

  let content = '';
  if (m.reply_to) {
    const rm = allMessages.find(x => x.id === m.reply_to);
    if (rm) {
      content += `<div class="reply-to"><div class="author">${escapeHtml(rm.sender === currentUser.id ? 'Ты' : (userCache[rm.sender]?.display_name || 'Кто-то'))}</div>${escapeHtml(rm.text?.slice(0, 60) || '...')}</div>`;
    }
  }

  if (m.deleted) {
    content += '<i>Сообщение удалено</i>';
  } else if (m.file_url) {
    if (m.file_type?.startsWith('image')) {
      content += `<img class="msg-img" src="${m.file_url}" onclick="viewImage('${m.file_url}')">`;
    } else {
      content += `<div class="file-box"><div class="file-icon">📎</div><div class="file-info"><div class="file-name">${escapeHtml(m.file_name || 'файл')}</div><div class="file-size">Нажми чтобы открыть</div></div><a href="${m.file_url}" target="_blank" style="color:var(--accent);font-size:20px;text-decoration:none">⬇</a></div>`;
    }
  } else {
    content += escapeHtml(m.text || '');
  }

  const t = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  const isMine = m.sender === currentUser.id;
  const check = isMine ? `<span class="check ${m.is_read ? 'read' : ''}">${m.is_read ? '✓✓' : '✓'}</span>` : '';
  div.innerHTML = content + `<div class="time">${t}${check}</div>`;
  wrap.appendChild(div);

  const reactions = document.createElement('div');
  reactions.className = 'reactions';
  reactions.dataset.msgId = m.id;
  wrap.appendChild(reactions);

  const toolbar = document.createElement('div');
  toolbar.className = 'msg-toolbar';
  toolbar.innerHTML = `
    <button data-act="react-👍">👍</button>
    <button data-act="react-❤️">❤️</button>
    <button data-act="react-😂">😂</button>
    <button data-act="reply">↩</button>
    <button data-act="pin">📌</button>
    ${isMine ? '<button data-act="edit">✏️</button>' : ''}
    ${isMine ? '<button data-act="delete">🗑</button>' : ''}
  `;
  wrap.appendChild(toolbar);

  div.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.msg-wrap.show-toolbar').forEach(x => x.classList.remove('show-toolbar'));
    wrap.classList.add('show-toolbar');
  };
  wrap.querySelectorAll('.msg-toolbar button').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      wrap.classList.remove('show-toolbar');
      if (act.startsWith('react-')) {
        const emoji = act.replace('react-', '');
        await toggleReaction(m.id, emoji);
      } else if (act === 'reply') {
        startReply(m);
      } else if (act === 'pin') {
        await sb.from('chats').update({ pinned_message_id: m.id, pinned_at: new Date().toISOString() }).eq('id', currentChatId);
        currentChatObj.pinned_message_id = m.id;
        renderPinned();
      } else if (act === 'edit') {
        const nt = prompt('Новое сообщение:', m.text);
        if (nt && nt !== m.text) {
          await sb.from('messages').update({ text: nt, edited_at: new Date().toISOString() }).eq('id', m.id);
          loadMessages(currentChatId);
        }
      } else if (act === 'delete') {
        if (confirm('Удалить сообщение?')) {
          await sb.from('messages').update({ deleted: true, text: '', file_url: null }).eq('id', m.id);
          loadMessages(currentChatId);
        }
      }
    };
  });

  msgs.appendChild(wrap);
  if (scroll) msgs.scrollTop = msgs.scrollHeight;
}

window.viewImage = (url) => {
  $('imgViewerImg').src = url;
  $('imgViewer').classList.add('active');
};

// ============ REACTIONS ============
let allReactions = [];

async function loadAllReactions() {
  const { data } = await sb.from('reactions').select('*');
  allReactions = data || [];
  renderReactions();
}

function renderReactions() {
  document.querySelectorAll('.reactions').forEach(el => {
    const msgId = el.dataset.msgId;
    const rs = allReactions.filter(r => r.message_id === msgId);
    const grouped = {};
    rs.forEach(r => { grouped[r.emoji] = grouped[r.emoji] || []; grouped[r.emoji].push(r.user_id); });
    el.innerHTML = Object.entries(grouped).map(([emoji, users]) =>
      `<div class="reaction ${users.includes(currentUser.id) ? 'mine' : ''}" data-msg="${msgId}" data-emoji="${emoji}">${emoji} ${users.length}</div>`
    ).join('');
    el.querySelectorAll('.reaction').forEach(r => {
      r.onclick = (e) => { e.stopPropagation(); toggleReaction(msgId, r.dataset.emoji); };
    });
  });
}

async function toggleReaction(msgId, emoji) {
  const existing = allReactions.find(r => r.message_id === msgId && r.user_id === currentUser.id && r.emoji === emoji);
  if (existing) {
    await sb.from('reactions').delete().eq('id', existing.id);
  } else {
    await sb.from('reactions').insert({ message_id: msgId, user_id: currentUser.id, emoji });
  }
  await loadAllReactions();
}

// ============ PINNED ============
function renderPinned() {
  const banner = $('pinnedBanner');
  if (!currentChatObj?.pinned_message_id) { banner.style.display = 'none'; return; }
  const m = allMessages.find(x => x.id === currentChatObj.pinned_message_id);
  if (!m) { banner.style.display = 'none'; return; }
  banner.style.display = 'flex';
  $('pinnedText').innerHTML = `<b>${m.sender === currentUser.id ? 'Ты' : (userCache[m.sender]?.display_name || 'Кто-то')}:</b> ${escapeHtml(m.text?.slice(0, 80) || '📎 файл')}`;
}
$('unpinBtn').onclick = async (e) => {
  e.stopPropagation();
  await sb.from('chats').update({ pinned_message_id: null }).eq('id', currentChatId);
  currentChatObj.pinned_message_id = null;
  renderPinned();
};

// ============ REPLY ============
function startReply(m) {
  replyTo = m;
  $('replyAuthor').textContent = m.sender === currentUser.id ? 'Ты' : (userCache[m.sender]?.display_name || 'Кто-то');
  $('replyText').textContent = m.text?.slice(0, 60) || '📎 файл';
  $('replyPreview').classList.add('show');
  $('messageInput').focus();
}
$('cancelReplyBtn').onclick = () => { replyTo = null; $('replyPreview').classList.remove('show'); };

window.showSidebar = () => {
  $('sidebar').classList.remove('hidden');
  $('chatHeader').style.display = 'none';
  $('messages').style.display = 'none';
  $('inputArea').style.display = 'none';
  $('emptyState').style.display = 'flex';
  $('pinnedBanner').style.display = 'none';
  $('searchMessagesBar').classList.remove('show');
  currentChatId = null;
  if (messagesChannel) { sb.removeChannel(messagesChannel); messagesChannel = null; }
  if (reactionsChannel) { sb.removeChannel(reactionsChannel); reactionsChannel = null; }
};

// ============ USER PROFILE ============
window.openUserProfile = async (uid) => {
  if (!uid) {
    if (currentChatObj?.is_group) return openGroupInfo();
    return;
  }
  const prof = await getUser(uid);
  if (!prof) return;
  const isOnline = prof.last_seen && (Date.now() - new Date(prof.last_seen).getTime()) < 60000;
  const lastSeen = prof.last_seen ? new Date(prof.last_seen).toLocaleString('ru') : 'неизвестно';
  $('userProfileContent').innerHTML = `
    <div class="user-profile-view">
      <div class="avatar-lg">${prof.avatar_url ? `<img src="${prof.avatar_url}">` : (prof.display_name||'?')[0].toUpperCase()}</div>
      <div class="name-lg">${escapeHtml(prof.display_name)} ${renderBadges(prof)}</div>
      <div class="nick-lg">@${escapeHtml(prof.username)}</div>
      ${prof.bio ? `<div class="bio-lg">${escapeHtml(prof.bio)}</div>` : ''}
      ${prof.phone ? `<div class="status-lg">📱 ${escapeHtml(prof.phone)}</div>` : ''}
      <div class="status-lg">${isOnline ? '🟢 в сети' : '⚫ ' + lastSeen}</div>
    </div>
    <button class="ghost" onclick="document.getElementById('userProfileModal').classList.remove('active')">Закрыть</button>
  `;
  $('userProfileModal').classList.add('active');
};

function openGroupInfo() {
  $('userProfileContent').innerHTML = `
    <div class="user-profile-view">
      <div class="avatar-lg">${currentChatObj.group_avatar ? `<img src="${currentChatObj.group_avatar}">` : '👥'}</div>
      <div class="name-lg">${escapeHtml(currentChatObj.group_name)}</div>
      <div class="status-lg">группа</div>
    </div>
    <button class="ghost" onclick="document.getElementById('userProfileModal').classList.remove('active')">Закрыть</button>
  `;
  $('userProfileModal').classList.add('active');
}

// ============ SEND ============
async function sendMessage() {
  const text = $('messageInput').value.trim();
  if (!text || !currentChatId) return;
  $('messageInput').value = '';
  const payload = {
    chat_id: currentChatId, sender: currentUser.id, text, is_read: false,
    reply_to: replyTo?.id || null
  };
  replyTo = null; $('replyPreview').classList.remove('show');
  const { error } = await sb.from('messages').insert(payload);
  if (error) return alert(error.message);
  await sb.from('chats').update({ last_message: text.slice(0, 50) }).eq('id', currentChatId);
  await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
}

$('sendBtn').onclick = sendMessage;
$('messageInput').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && settings.enterSend !== false) { e.preventDefault(); sendMessage(); }
};

// ============ ATTACH ============
$('attachBtn').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*,.pdf,.doc,.docx,.txt,.zip';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) return alert('Файл > 20 МБ');
    const path = `${currentChatId}/${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from('media').upload(path, file);
    if (error) return alert(error.message);
    const { data: u } = sb.storage.from('media').getPublicUrl(path);
    await sb.from('messages').insert({
      chat_id: currentChatId, sender: currentUser.id,
      text: '', is_read: false,
      file_url: u.publicUrl, file_type: file.type, file_name: file.name
    });
    await sb.from('chats').update({ last_message: '📎 ' + file.name }).eq('id', currentChatId);
  };
  inp.click();
};

// ============ EMOJI ============
$('emojiBtn').onclick = (e) => { e.stopPropagation(); const p = $('emojiPicker'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; };
$('emojiPicker').addEventListener('emoji-click', (e) => { $('messageInput').value += e.detail.unicode; $('messageInput').focus(); });
document.addEventListener('click', (e) => {
  if (!e.target.closest('.emoji-picker-container')) $('emojiPicker').style.display = 'none';
  if (!e.target.closest('.msg-wrap')) document.querySelectorAll('.msg-wrap.show-toolbar').forEach(x => x.classList.remove('show-toolbar'));
});

// ============ SEARCH IN MESSAGES ============
$('searchMsgBtn').onclick = () => { $('searchMessagesBar').classList.toggle('show'); $('searchMessagesInput').focus(); };
$('closeSearchMsg').onclick = () => $('searchMessagesBar').classList.remove('show');
$('searchMessagesInput').oninput = (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.msg-wrap').forEach(w => {
    const t = w.querySelector('.msg')?.textContent.toLowerCase() || '';
    w.style.opacity = q && !t.includes(q) ? '0.3' : '1';
  });
};

// ============ NEW CHAT ============
$('newChatBtn').onclick = () => $('searchInput').focus();

// ============ GROUP ============
$('newGroupBtn').onclick = () => {
  selectedMembers = [];
  $('groupNameInput').value = '';
  $('groupSearchInput').value = '';
  $('groupSearchResults').innerHTML = '';
  $('groupSelected').innerHTML = '';
  $('groupModal').classList.add('active');
};

$('groupSearchInput').oninput = async (e) => {
  const val = e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  const box = $('groupSearchResults');
  if (!val || val.length < 2) { box.innerHTML = ''; return; }
  const { data } = await sb.from('profiles').select('*').ilike('username', `%${val}%`).limit(10);
  box.innerHTML = '';
  (data || []).filter(u => u.id !== currentUser.id).forEach(u => {
    const div = document.createElement('div');
    div.className = 'admin-user';
    div.innerHTML = `
      <div class="chat-avatar" style="width:36px;height:36px;font-size:14px">${u.avatar_url ? `<img src="${u.avatar_url}">` : (u.display_name||'?')[0].toUpperCase()}</div>
      <div class="info"><div class="uname">${escapeHtml(u.display_name)} ${renderBadges(u)}</div><div class="nick">@${escapeHtml(u.username)}</div></div>
      <button class="btn-mini btn-blue">+</button>
    `;
    div.querySelector('button').onclick = () => {
      if (selectedMembers.find(m => m.id === u.id)) return;
      selectedMembers.push(u);
      renderSelectedMembers();
    };
    box.appendChild(div);
  });
};

function renderSelectedMembers() {
  $('groupSelected').innerHTML = selectedMembers.map(u =>
    `<div class="group-member">${u.avatar_url ? `<img src="${u.avatar_url}">` : ''}${escapeHtml(u.display_name)} <span data-uid="${u.id}" style="cursor:pointer;color:var(--red)">✕</span></div>`
  ).join('');
  $('groupSelected').querySelectorAll('span[data-uid]').forEach(s => {
    s.onclick = () => {
      selectedMembers = selectedMembers.filter(m => m.id !== s.dataset.uid);
      renderSelectedMembers();
    };
  });
}

$('createGroupBtn').onclick = async () => {
  const name = $('groupNameInput').value.trim();
  if (!name) return alert('Введи название');
  if (selectedMembers.length === 0) return alert('Выбери хотя бы одного участника');
  const uid = currentUser.id;
  const { data, error } = await sb.from('chats').insert({
    user1: uid, user2: uid, is_group: true, group_name: name, created_by: uid, last_message: 'Группа создана'
  }).select().single();
  if (error) return alert(error.message);
  const members = [uid, ...selectedMembers.map(m => m.id)];
  for (const m of members) {
    await sb.from('chat_members').insert({ chat_id: data.id, user_id: m });
  }
  $('groupModal').classList.remove('active');
  await loadChats();
  openChat(data.id, null);
};

// ============ ADMIN ============
let logoClicks = 0;
$('logo').onclick = () => {
  logoClicks++;
  if (logoClicks >= 5) {
    $('adminModal').classList.add('active');
    if (isAdmin) showAdminPanel();
    else { $('adminLoginSection').style.display = 'block'; $('adminPanelSection').style.display = 'none'; }
    logoClicks = 0;
  }
};
$('adminCloseBtn').onclick = () => $('adminModal').classList.remove('active');

async function checkAdmin() {
  const { data } = await sb.from('admins').select('id').eq('id', currentUser.id).maybeSingle();
  isAdmin = !!data;
  if (isAdmin) { console.log('👑 админ'); document.body.style.border = '3px solid gold'; }
}

$('adminLoginBtn').onclick = async () => {
  const secret = $('adminSecret').value;
  $('adminError').textContent = '';
  if (secret !== ADMIN_SECRET) return $('adminError').textContent = '❌ Неверный пароль';
  const { error } = await sb.from('admins').insert({ id: currentUser.id });
  if (error && !error.message.includes('duplicate')) return $('adminError').textContent = error.message;
  isAdmin = true;
  $('adminError').style.color = '#2ecc71';
  $('adminError').textContent = '✅ Ты админ!';
  setTimeout(() => { $('adminSecret').value = ''; showAdminPanel(); }, 800);
};

async function showAdminPanel() {
  $('adminLoginSection').style.display = 'none';
  $('adminPanelSection').style.display = 'block';
  await loadAdminUsers('');
}

$('adminSearchUser').oninput = (e) => loadAdminUsers(e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''));

async function loadAdminUsers(search) {
  const list = $('adminUserList');
  list.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:13px">Загрузка...</div>';
  let q = sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(50);
  if (search.length >= 2) q = q.ilike('username', `%${search}%`);
  const { data } = await q;
  list.innerHTML = '';
  if (!data || data.length === 0) return list.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:13px;text-align:center">Никого не найдено</div>';
  data.forEach(u => {
    const div = document.createElement('div');
    div.className = 'admin-user';
    const isCreator = u.username === CREATOR_USERNAME;
    div.innerHTML = `
      <div class="info"><div class="uname">${escapeHtml(u.display_name || u.username)} ${renderBadges(u)}</div>
      <div class="nick">@${escapeHtml(u.username)}${isCreator ? ' • создатель' : ''}</div></div>
      <button class="btn-mini btn-blue ${u.is_verified ? '' : 'off'}" data-uid="${u.id}">${u.is_verified ? '🔵 ✓' : '✓'}</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll('.btn-blue').forEach(btn => {
    btn.onclick = async () => {
      const uid = btn.dataset.uid;
      const { data: cur } = await sb.from('profiles').select('is_verified').eq('id', uid).single();
      const nv = !cur.is_verified;
      await sb.from('profiles').update({ is_verified: nv }).eq('id', uid);
      btn.classList.toggle('off', !nv);
      btn.textContent = nv ? '🔵 ✓' : '✓';
      userCache = {};
      await loadChats();
    };
  });
}

$('adminLogoutBtn').onclick = async () => {
  if (!confirm('Снять с себя права админа?')) return;
  await sb.from('admins').delete().eq('id', currentUser.id);
  isAdmin = false; location.reload();
};

// ============ CHAT MENU ============
$('chatMenuBtn').onclick = async (e) => {
  e.stopPropagation();
  if (!currentChatId) return;
  const menu = prompt('Введи действие:\n1 - Очистить чат\n2 - Удалить чат\n3 - Отмена');
  if (menu === '1') {
    if (confirm('Очистить все сообщения в чате?')) {
      await sb.from('messages').delete().eq('chat_id', currentChatId);
      loadMessages(currentChatId);
    }
  } else if (menu === '2') {
    if (confirm('Удалить чат полностью?')) {
      await sb.from('messages').delete().eq('chat_id', currentChatId);
      await sb.from('chats').delete().eq('id', currentChatId);
      showSidebar();
      loadChats();
    }
  }
};

// ============ HELPERS ============
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; }

// ============ START ============
initAuth();
</script>
</body>
 </html>

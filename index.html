<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Spacegram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="stylesheet" href="styles.css?v=17">
<script>
window.onerror=function(msg,src,line,col,err){
  console.error('ОШИБКА:',msg,src,line+':'+col);
  if(err&&err.stack)console.error(err.stack);
};
window.addEventListener('unhandledrejection',function(e){
  console.error('PROMISE:',e.reason);
});
</script>
<style>
@keyframes heartPop {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg) translateY(-60px); opacity: 0; }
}
</style>
</head>
<body>

<div id="L">
  <div class="sp"></div>
  <div style="color:#7f91a4;font-size:13px">Загрузка...</div>
  <div id="D"></div>
</div>

<div id="BE" style="display:none"></div>

<div id="A" style="display:none">
  <h1>✈️ Spacegram</h1>
  <input type="email" id="em" placeholder="Email" autocomplete="email">
  <input type="password" id="pw" placeholder="Пароль (мин. 6)" autocomplete="current-password">
  <input type="text" id="un" placeholder="@username" autocomplete="username">
  <div id="AE"></div>
  <button id="bL">Войти</button>
  <button id="bR">Регистрация</button>
  <div style="margin-top:18px;display:flex;flex-direction:column;gap:7px;width:100%;max-width:340px">
    <button type="button" id="bTUnban">🚫 Запросить разбан</button>
    <button type="button" id="bTContact">💬 Связаться с админом</button>
    <button type="button" id="bTAge">🔞 Подтвердить 16+</button>
  </div>
</div>

<div class="app" id="APP" style="display:none">
  <div class="sd" id="SD">
    <div class="tp">
      <button class="tb" id="bSidebar" title="Меню">☰</button>
      <h2 id="lg">✈️ Spacegram</h2>
      <div class="a" id="topActs">
        <button class="tb" id="bAdm" style="display:none" title="Админ">🔐</button>
        <button class="tb" id="bNewChat" title="Новый чат">💬</button>
        <button class="tb" id="bGrp" title="Группа">➕</button>
        <button class="tb" id="bSearch" title="Поиск">🔍</button>
        <div class="avt" id="myA" title="Профиль">?</div>
      </div>
    </div>

    <div class="folders" id="folders">
      <button class="folder-btn on" data-folder="all">Все</button>
      <button class="folder-btn" data-folder="personal">Личные</button>
      <button class="folder-btn" data-folder="groups">Группы</button>
      <button class="folder-btn" data-folder="channels">Каналы</button>
      <button class="folder-btn" data-folder="bots">Боты</button>
    </div>

    <div class="st" id="sBar"></div>

    <div class="sr">
      <input id="srch" placeholder="Поиск @username или текст..." autocomplete="off">
    </div>

    <div class="ls" id="chats"></div>
  </div>

  <div class="fd" id="fdScr">
    <div style="padding:10px 4px">
      <h2 style="font-size:19px;font-weight:800">📰 Лента</h2>
    </div>
    <div id="fdL"></div>
  </div>
  <div class="fc" id="fcBtn" style="display:none" title="Написать пост">✏️</div>

  <div class="area" id="AR">
    <div class="chd" id="CH" style="display:none">
      <button class="bk" id="bBack">←</button>
      <div class="hv" id="hA">?</div>
      <div class="hi" id="hI">
        <h3 id="hN">—</h3>
        <div class="sub" id="hS"></div>
      </div>
      <div class="ha">
        <button id="bStalk" title="StalkerGram">🕵️</button>
        <button id="bChatGallery" title="Галерея">🖼️</button>
        <button id="bSrch" title="Поиск">🔍</button>
        <button id="bMenu" title="Меню">⋮</button>
      </div>
    </div>

    <div class="ms" id="msgs" style="display:none"></div>

    <div class="rp" id="rP" style="display:none">
      <div class="br"></div>
      <div class="cc">
        <div class="ca" id="rA"></div>
        <div class="ct" id="rT"></div>
      </div>
      <button id="rClose">✕</button>
    </div>

    <div class="pnl h" id="stkP">
      <div style="font-size:10px;color:var(--a);font-weight:700;margin-bottom:8px">СТИКЕРЫ</div>
      <div id="stkG" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px"></div>
    </div>

    <div class="pnl h" id="gifP">
      <input id="gifS" placeholder="Поиск GIF..." style="width:100%;padding:10px 14px;border-radius:10px;background:var(--p2);color:var(--t);margin-bottom:8px;border:1px solid var(--br)">
      <div id="gifG" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px"></div>
    </div>

    <div class="pnl h" id="brnP">
      <div style="font-size:12px;color:var(--r);font-weight:700;margin-bottom:8px">🔥 САМОУНИЧТОЖЕНИЕ</div>
      <div class="tg" id="brnO">
        <button data-b="0" class="on">Выкл</button>
        <button data-b="5">5с</button>
        <button data-b="30">30с</button>
        <button data-b="60">1м</button>
      </div>
    </div>

    <div class="pnl h" id="attP">
      <div style="font-size:10px;color:var(--a);font-weight:700;margin-bottom:10px">ВЛОЖЕНИЯ</div>
      <div class="ag">
        <button class="agb" id="ap"><span class="ic">🖼️</span><span>Фото</span></button>
        <button class="agb" id="af"><span class="ic">📎</span><span>Файл</span></button>
        <button class="agb" id="as"><span class="ic">😊</span><span>Стикер</span></button>
        <button class="agb" id="ag"><span class="ic">🎬</span><span>GIF</span></button>
        <button class="agb" id="avn"><span class="ic">⭕</span><span>Кружок</span></button>
        <button class="agb" id="ab"><span class="ic">🔥</span><span>Сжечь</span></button>
        <button class="agb" id="apo"><span class="ic">📊</span><span>Опрос</span></button>
      </div>
    </div>

    <div class="inp" id="inp" style="display:none">
      <button class="ib" id="bPlus" title="Вложения">📎</button>
      <div class="ep" id="emW">
        <button class="ib" id="bEmo" title="Эмодзи">😊</button>
      </div>
      <emoji-picker id="ep" locale="ru"></emoji-picker>
      <input id="msgI" placeholder="Сообщение" autocomplete="off">
      <button class="ib" id="bMic" title="Голосовое">🎤</button>
      <button class="ib sn" id="bSend" title="Отправить">➤</button>
    </div>

    <div class="emp" id="emp">
      <div class="ic">💬</div>
      <div>Выбери чат</div>
    </div>
  </div>

  <div class="bn" id="bnv">
    <button class="on" data-tab="chats"><span class="bi">💬</span>Чаты</button>
    <button data-tab="feed"><span class="bi">📰</span>Лента</button>
    <button data-tab="profile"><span class="bi">👤</span>Профиль</button>
  </div>
</div>

<div class="md" id="profM"><div class="mb" id="profBox"></div></div>
<div class="md" id="setM"><div class="mb" id="setBox"></div></div>
<div class="md" id="privM"><div class="mb" id="privBox"></div></div>
<div class="md" id="promoM"><div class="mb" id="promoBox"></div></div>
<div class="md" id="modsM"><div class="mb" id="modsBox"></div></div>
<div class="md" id="shopM"><div class="mb" id="shopBox"></div></div>
<div class="md" id="cosmeticsM"><div class="mb" id="cosmeticsBox"></div></div>
<div class="md" id="myStickersM"><div class="mb" id="myStickersBox"></div></div>
<div class="md" id="verM"><div class="mb" id="verBox"></div></div>
<div class="md" id="postM"><div class="mb" id="postBox"></div></div>
<div class="md" id="grpM"><div class="mb" id="grpBox"></div></div>
<div class="md" id="pollM"><div class="mb" id="pollBox"></div></div>
<div class="md" id="botM"><div class="mb" id="botBox"></div></div>
<div class="md" id="appM"><div class="mb" id="appBox"></div></div>
<div class="md" id="sessM"><div class="mb" id="sessBox"></div></div>
<div class="md" id="reportM"><div class="mb" id="reportBox"></div></div>
<div class="md" id="ticketM"><div class="mb" id="ticketBox"></div></div>

<div class="apn" id="apn">
  <div style="display:flex;flex-direction:column;min-height:100%">
    <div class="atp">
      <h2>🔐 Админ-панель</h2>
      <button onclick="document.getElementById('apn').classList.remove('show')">✕</button>
    </div>
    <div class="ast" id="astat"></div>
    <div class="atb" id="atab"></div>
    <div class="abd" id="abod"></div>
  </div>
</div>

<div id="bm"><div id="bmc"></div></div>

<div id="pinLock">
  <div style="font-size:60px">🔒</div>
  <div style="font-size:20px;font-weight:700">Введи PIN</div>
  <div id="pinDots">○ ○ ○ ○</div>
  <div id="pinErr" style="font-size:14px;color:#e53935;min-height:20px"></div>
  <div id="pinKb"></div>
</div>

<div class="sv" id="svV">
  <div class="sh" id="svH"></div>
  <div class="sc" id="svC"></div>
  <button style="position:absolute;top:20px;right:12px;z-index:15;background:rgba(0,0,0,.4);width:36px;height:36px;border-radius:50%;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none" onclick="document.getElementById('svV').classList.remove('show')">✕</button>
</div>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.20.0/index.js';
</script>

<script type="module" src="app.js?v=17"></script>

</body>
    </html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spacegram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: #0e1621; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

  .app {
    width: 100%; max-width: 960px; height: 100vh; max-height: 700px;
    display: flex; overflow: hidden; background: #17212b;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  @media (min-width: 768px) { .app { border-radius: 16px; height: 700px; } }

  .auth-screen {
    width: 100%; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 30px; gap: 14px; background: #17212b;
  }
  .auth-screen h1 { color: #64b5ef; font-size: 32px; margin-bottom: 10px; }
  .auth-screen input {
    width: 100%; max-width: 320px; padding: 14px 18px; border: none; border-radius: 12px;
    background: #242f3d; color: #fff; outline: none; font-size: 15px;
  }
  .auth-screen input::placeholder { color: #5d7285; }
  .auth-screen button {
    width: 100%; max-width: 320px; padding: 14px; border: none; border-radius: 12px;
    background: #2b5278; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: 0.2s;
  }
  .auth-screen button:hover { background: #3a6a94; }
  .auth-screen .error { color: #e74c3c; font-size: 13px; min-height: 18px; text-align: center; }
  .auth-screen .hint { color: #5d7285; font-size: 12px; text-align: center; max-width: 320px; }

  .main-app { display: none; width: 100%; height: 100%; }
  .main-app.active { display: flex; }

  .sidebar {
    width: 300px; background: #17212b; border-right: 1px solid #242f3d;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  @media (max-width: 600px) {
    .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
    .sidebar.hidden { display: none; }
  }

  .sidebar-header {
    padding: 14px 16px; border-bottom: 1px solid #242f3d; display: flex;
    justify-content: space-between; align-items: center;
  }
  .sidebar-header h2 { color: #fff; font-size: 20px; font-weight: 700; cursor: pointer; user-select: none; }
  .user-avatar-small {
    width: 36px; height: 36px; border-radius: 50%; background: #2b5278;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    cursor: pointer; overflow: hidden; color: #fff; font-weight: 600;
  }
  .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }

  .search-box { padding: 10px 16px; }
  .search-box input {
    width: 100%; padding: 10px 14px; border: none; border-radius: 10px;
    background: #242f3d; color: #fff; outline: none; font-size: 14px;
  }
  .search-box input::placeholder { color: #5d7285; }

  .chat-list { flex: 1; overflow-y: auto; }
  .chat-list::-webkit-scrollbar { width: 5px; }
  .chat-list::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }

  .chat-item {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: 0.15s;
  }
  .chat-item:hover { background: #1c2733; }
  .chat-item.active { background: #2b5278; }
  .chat-avatar {
    width: 48px; height: 48px; border-radius: 50%; background: #2b5278;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    flex-shrink: 0; overflow: hidden; color: #fff; font-weight: 600;
  }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { color: #fff; font-weight: 600; font-size: 15px; }
  .chat-preview { color: #7d8b99; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .chat-area { flex: 1; display: flex; flex-direction: column; background: #0e1621; position: relative; }

  .chat-header {
    padding: 12px 16px; background: #17212b; border-bottom: 1px solid #242f3d;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    display: none; background: none; border: none; color: #64b5ef; font-size: 24px;
    cursor: pointer; padding: 0 8px;
  }
  @media (max-width: 600px) { .back-btn { display: block; } }
  .header-avatar {
    width: 42px; height: 42px; border-radius: 50%; background: #2b5278;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    overflow: hidden; color: #fff; font-weight: 600;
  }
  .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .header-info h3 { color: #fff; font-size: 16px; font-weight: 600; }
  .header-info .status { color: #64b5ef; font-size: 12px; }

  .messages {
    flex: 1; padding: 16px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }

  .msg {
    max-width: 75%; padding: 8px 14px; border-radius: 14px; font-size: 14px;
    line-height: 1.4; word-wrap: break-word; color: #fff; animation: pop 0.15s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .msg.me { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 4px; }
  .msg.you { align-self: flex-start; background: #182533; border-bottom-left-radius: 4px; }
  .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }

  .input-area { padding: 10px 16px; background: #17212b; display: flex; gap: 8px; align-items: center; }
  .input-area input {
    flex: 1; padding: 12px 16px; border: none; border-radius: 22px;
    background: #242f3d; color: #fff; outline: none; font-size: 14px;
  }
  .input-area input::placeholder { color: #5d7285; }
  .icon-btn {
    width: 42px; height: 42px; border: none; border-radius: 50%;
    background: #242f3d; color: #64b5ef; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .icon-btn:hover { background: #2b5278; }
  .send-btn { background: #2b5278; color: #fff; }
  .send-btn:hover { background: #3a6a94; }

  .emoji-picker-container { position: relative; }
  emoji-picker {
    position: absolute; bottom: 50px; right: 0; z-index: 100;
    --background: #17212b; --border-color: #242f3d; --indicator-color: #64b5ef;
    --input-border-color: #242f3d; --input-background: #242f3d;
    --input-color: #fff;
  }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #5d7285; font-size: 15px; text-align: center; padding: 20px;
  }

  /* Profile modal */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 1000; justify-content: center; align-items: center; padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #17212b; padding: 24px; border-radius: 16px; width: 100%; max-width: 380px;
    color: #fff; display: flex; flex-direction: column; gap: 12px;
  }
  .modal-content h2 { font-size: 20px; margin-bottom: 4px; }
  .modal-content input {
    padding: 12px; border: none; border-radius: 10px; background: #242f3d;
    color: #fff; outline: none; font-size: 14px; width: 100%;
  }
  .modal-content button {
    padding: 12px; border: none; border-radius: 10px; background: #2b5278;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .modal-content button.danger { background: #e74c3c; }
  .modal-content button.ghost { background: #242f3d; }
  .modal-content .avatar-preview {
    width: 80px; height: 80px; border-radius: 50%; background: #2b5278;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
    margin: 0 auto; overflow: hidden; font-weight: 600;
  }
  .modal-content .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal-content .info { color: #7d8b99; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Auth -->
  <div class="auth-screen" id="authScreen">
    <h1>🚀 Spacegram</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
    <input type="text" id="usernameInput" placeholder="@username (латиница, цифры)">
    <div class="error" id="authError"></div>
    <button id="loginBtn">Войти</button>
    <button id="registerBtn" style="background:#242f3d">Зарегистрироваться</button>
    <div class="hint">При регистрации username обязателен. Пароль минимум 6 символов.</div>
  </div>

  <!-- Main -->
  <div class="main-app" id="mainApp">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 id="logo">💬 Spacegram</h2>
        <div class="user-avatar-small" id="myAvatar" onclick="openProfileModal()">?</div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по @username...">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader" style="display:none">
        <button class="back-btn" onclick="showSidebar()">←</button>
        <div class="header-avatar" id="headerAvatar">?</div>
        <div class="header-info">
          <h3 id="headerName">—</h3>
          <div class="status" id="headerStatus"></div>
        </div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
      <div class="input-area" id="inputArea" style="display:none">
        <div class="emoji-picker-container">
          <button class="icon-btn" id="emojiBtn">😀</button>
          <emoji-picker id="emojiPicker" locale="ru" style="display:none"></emoji-picker>
        </div>
        <input type="text" id="messageInput" placeholder="Напиши сообщение...">
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
      <div class="empty-state" id="emptyState">Выбери чат или найди пользователя через поиск 🔍</div>
    </div>
  </div>
</div>

<!-- Profile modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>Профиль</h2>
    <div class="avatar-preview" id="avatarPreview">?</div>
    <button class="ghost" id="changeAvatarBtn">📷 Сменить аватар</button>
    <input type="text" id="profileName" placeholder="Имя">
    <input type="text" id="profileUsername" placeholder="@username" disabled style="opacity:0.6">
    <button id="saveProfileBtn">Сохранить</button>
    <button class="danger" id="logoutBtn">Выйти</button>
    <button class="ghost" id="closeProfileBtn">Закрыть</button>
  </div>
</div>

<!-- Admin modal -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h2>🔐 Админ-панель</h2>
    <input type="password" id="adminSecret" placeholder="Секретный пароль">
    <div class="error" id="adminError" style="color:#e74c3c;font-size:13px;min-height:18px"></div>
    <button id="adminLoginBtn">Войти как админ</button>
    <button class="ghost" id="adminCloseBtn">Закрыть</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, onSnapshot, addDoc, orderBy, serverTimestamp, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js';

const firebaseConfig = {
  apiKey: "AIzaSyA55MfeW65RKKFCWXDou_9w9GPNTEH2Ans",
  authDomain: "spaceweb-f0110.firebaseapp.com",
  projectId: "spaceweb-f0110",
  storageBucket: "spaceweb-f0110.firebasestorage.app",
  messagingSenderId: "1094229332741",
  appId: "1:1094229332741:web:7d6410733b2c2742691d6c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// 🔐 СЕКРЕТНЫЙ ПАРОЛЬ АДМИНА — поменяй на свой
const ADMIN_SECRET = "spacegram2026";

let currentUser = null;
let currentChatId = null;
let currentChatUser = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;

const $ = (id) => document.getElementById(id);
const authScreen = $('authScreen');
const mainApp = $('mainApp');

// ============ AUTH ============
$('loginBtn').onclick = async () => {
  $('authError').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('email').value, $('password').value);
  } catch (e) { $('authError').textContent = translateError(e.code); }
};

$('registerBtn').onclick = async () => {
  $('authError').textContent = '';
  const email = $('email').value.trim();
  const pass = $('password').value;
  let username = $('usernameInput').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!email || !pass) { $('authError').textContent = 'Заполни email и пароль'; return; }
  if (pass.length < 6) { $('authError').textContent = 'Пароль минимум 6 символов'; return; }
  if (!username || username.length < 3) { $('authError').textContent = 'Username минимум 3 символа (a-z, 0-9, _)'; return; }
  try {
    // Проверка что username свободен
    const unameCheck = await getDocs(query(collection(db, 'users'), where('username', '==', '@' + username)));
    if (!unameCheck.empty) { $('authError').textContent = 'Этот @username уже занят'; return; }

    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: username });
    await setDoc(doc(db, 'users', cred.user.uid), {
      email: cred.user.email,
      username: '@' + username,
      displayName: username,
      avatar: '',
      createdAt: serverTimestamp()
    });
  } catch (e) { $('authError').textContent = translateError(e.code); }
};

function translateError(code) {
  const map = {
    'auth/email-already-in-use': 'Этот email уже зарегистрирован',
    'auth/invalid-email': 'Неверный email',
    'auth/weak-password': 'Слабый пароль (мин. 6 символов)',
    'auth/user-not-found': 'Пользователь не найден',
    'auth/wrong-password': 'Неверный пароль',
    'auth/invalid-credential': 'Неверный email или пароль',
    'auth/network-request-failed': 'Нет соединения с интернетом',
    'auth/operation-not-allowed': 'Email/Password не включён в Firebase Console',
    'permission-denied': 'Нет доступа (проверь Rules в Firestore)'
  };
  return map[code] || ('Ошибка: ' + code);
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    authScreen.style.display = 'none';
    mainApp.classList.add('active');
    await loadMyProfile();
    listenToChats();
  } else {
    currentUser = null;
    authScreen.style.display = 'flex';
    mainApp.classList.remove('active');
    if (unsubscribeChats) unsubscribeChats();
  }
});

// ============ PROFILE ============
let myProfileCache = null;

async function loadMyProfile() {
  const snap = await getDoc(doc(db, 'users', currentUser.uid));
  if (snap.exists()) {
    myProfileCache = snap.data();
    const a = $('myAvatar');
    if (myProfileCache.avatar) a.innerHTML = `<img src="${myProfileCache.avatar}">`;
    else a.textContent = (myProfileCache.displayName || '?')[0].toUpperCase();
  }
}

window.openProfileModal = () => {
  if (!myProfileCache) return;
  $('profileName').value = myProfileCache.displayName || '';
  $('profileUsername').value = myProfileCache.username || '';
  const prev = $('avatarPreview');
  if (myProfileCache.avatar) prev.innerHTML = `<img src="${myProfileCache.avatar}">`;
  else prev.textContent = (myProfileCache.displayName || '?')[0].toUpperCase();
  $('profileModal').classList.add('active');
};

$('closeProfileBtn').onclick = () => $('profileModal').classList.remove('active');

$('changeAvatarBtn').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('Файл больше 2 МБ'); return; }
    const r = storageRef(storage, `avatars/${currentUser.uid}`);
    await uploadBytes(r, file);
    const url = await getDownloadURL(r);
    await updateDoc(doc(db, 'users', currentUser.uid), { avatar: url });
    myProfileCache.avatar = url;
    $('avatarPreview').innerHTML = `<img src="${url}">`;
    await loadMyProfile();
  };
  inp.click();
};

$('saveProfileBtn').onclick = async () => {
  const name = $('profileName').value.trim();
  if (!name) return;
  await updateProfile(currentUser, { displayName: name });
  await updateDoc(doc(db, 'users', currentUser.uid), { displayName: name });
  myProfileCache.displayName = name;
  await loadMyProfile();
  $('profileModal').classList.remove('active');
};

$('logoutBtn').onclick = async () => { await signOut(auth); location.reload(); };

// ============ CHATS ============
function listenToChats() {
  if (unsubscribeChats) unsubscribeChats();
  const q = query(collection(db, 'chats'), where('members', 'array-contains', currentUser.uid));
  unsubscribeChats = onSnapshot(q, (snap) => {
    const list = $('chatList');
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = '<div style="padding:20px;color:#5d7285;text-align:center;font-size:14px">Нет чатов. Найди пользователя через поиск 🔍</div>';
      return;
    }
    snap.forEach(d => {
      const chat = d.data();
      const otherId = chat.members.find(m => m !== currentUser.uid);
      const div = document.createElement('div');
      div.className = 'chat-item' + (d.id === currentChatId ? ' active' : '');
      div.onclick = () => openChat(d.id, otherId);
      div.innerHTML = `<div class="chat-avatar">?</div>
        <div class="chat-info"><div class="chat-name">…</div>
        <div class="chat-preview">${chat.lastMessage || 'Начни общение'}</div></div>`;
      list.appendChild(div);
      getDoc(doc(db, 'users', otherId)).then(u => {
        const ud = u.data();
        if (!ud) return;
        div.querySelector('.chat-avatar').innerHTML = ud.avatar ? `<img src="${ud.avatar}">` : (ud.displayName || '?')[0].toUpperCase();
        div.querySelector('.chat-name').textContent = ud.displayName || 'Пользователь';
      });
    });
  });
}

// ============ SEARCH ============
$('searchInput').oninput = async (e) => {
  const val = e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  const list = $('chatList');
  if (!val || val.length < 2) { listenToChats(); return; }
  const username = '@' + val;
  const snap = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
  list.innerHTML = '';
  if (snap.empty) {
    list.innerHTML = '<div style="padding:20px;color:#5d7285;text-align:center;font-size:14px">Пользователь не найден</div>';
    return;
  }
  snap.forEach(d => {
    if (d.id === currentUser.uid) {
      list.innerHTML += '<div style="padding:20px;color:#5d7285;text-align:center;font-size:14px">Это ты 🙂</div>';
      return;
    }
    const u = d.data();
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `<div class="chat-avatar">${u.avatar ? `<img src="${u.avatar}">` : (u.displayName||'?')[0].toUpperCase()}</div>
      <div class="chat-info"><div class="chat-name">${u.displayName}</div>
      <div class="chat-preview">${u.username}</div></div>`;
    div.onclick = () => startChat(d.id);
    list.appendChild(div);
  });
};

async function startChat(otherId) {
  const chatId = [currentUser.uid, otherId].sort().join('_');
  const chatRef = doc(db, 'chats', chatId);
  const snap = await getDoc(chatRef);
  if (!snap.exists()) {
    await setDoc(chatRef, {
      members: [currentUser.uid, otherId],
      createdAt: serverTimestamp(),
      lastMessage: ''
    });
  }
  $('searchInput').value = '';
  listenToChats();
  openChat(chatId, otherId);
}

// ============ OPEN CHAT ============
async function openChat(chatId, otherId) {
  currentChatId = chatId;
  currentChatUser = otherId;
  $('sidebar').classList.add('hidden');
  $('chatHeader').style.display = 'flex';
  $('messages').style.display = 'flex';
  $('inputArea').style.display = 'flex';
  $('emptyState').style.display = 'none';

  const u = await getDoc(doc(db, 'users', otherId));
  const ud = u.data();
  $('headerName').textContent = ud?.displayName || 'Пользователь';
  $('headerStatus').textContent = ud?.username || '';
  const ha = $('headerAvatar');
  ha.innerHTML = ud?.avatar ? `<img src="${ud.avatar}">` : (ud?.displayName||'?')[0].toUpperCase();

  if (unsubscribeMessages) unsubscribeMessages();
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt'));
  unsubscribeMessages = onSnapshot(q, (snap) => {
    const msgs = $('messages');
    msgs.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.sender === currentUser.uid ? 'me' : 'you');
      const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'}) : '';
      div.innerHTML = `${escapeHtml(m.text)}<div class="time">${time}</div>`;
      msgs.appendChild(div);
    });
    msgs.scrollTop = msgs.scrollHeight;
  });
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

window.showSidebar = () => {
  $('sidebar').classList.remove('hidden');
  $('chatHeader').style.display = 'none';
  $('messages').style.display = 'none';
  $('inputArea').style.display = 'none';
  $('emptyState').style.display = 'flex';
  currentChatId = null;
};

// ============ SEND MESSAGE ============
async function sendMessage() {
  const text = $('messageInput').value.trim();
  if (!text || !currentChatId) return;
  await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
    text, sender: currentUser.uid, createdAt: serverTimestamp()
  });
  await updateDoc(doc(db, 'chats', currentChatId), { lastMessage: text.slice(0, 40) });
  $('messageInput').value = '';
}

$('sendBtn').onclick = sendMessage;
$('messageInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

// ============ EMOJI ============
$('emojiBtn').onclick = (e) => {
  e.stopPropagation();
  const p = $('emojiPicker');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
};
$('emojiPicker').addEventListener('emoji-click', (e) => {
  $('messageInput').value += e.detail.unicode;
  $('messageInput').focus();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.emoji-picker-container')) {
    $('emojiPicker').style.display = 'none';
  }
});

// ============ ADMIN ============
let logoClicks = 0;
$('logo').onclick = () => {
  logoClicks++;
  if (logoClicks >= 5) { $('adminModal').classList.add('active'); logoClicks = 0; }
};

$('adminCloseBtn').onclick = () => $('adminModal').classList.remove('active');

$('adminLoginBtn').onclick = async () => {
  const secret = $('adminSecret').value;
  $('adminError').textContent = '';
  if (secret !== ADMIN_SECRET) {
    $('adminError').textContent = '❌ Неверный пароль';
    return;
  }
  // Записываем в Firestore флаг админа
  await setDoc(doc(db, 'admins', currentUser.uid), {
    email: currentUser.email,
    grantedAt: serverTimestamp()
  });
  $('adminError').style.color = '#2ecc71';
  $('adminError').textContent = '✅ Права админа выданы';
  setTimeout(() => location.reload(), 1200);
};

// Проверка админ-статуса
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const a = await getDoc(doc(db, 'admins', user.uid)).catch(() => null);
    if (a && a.exists()) {
      console.log('👑 Ты админ!');
      document.body.style.border = '3px solid gold';
    }
  }
});
</script>
</body>
</html>
